<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem("dhsud_session") || "null");
    if (!s || !s.expires || Date.now() > s.expires) {
      localStorage.removeItem("dhsud_session");
      location.replace("login.html?next=" + encodeURIComponent("users.html"));
      return;
    }
    if (s.role !== "admin") {
      alert("You don't have permission to access this page.");
      location.replace("travel.html");
      return;
    }
    s.expires = Date.now() + 8 * 60 * 60 * 1000;
    localStorage.setItem("dhsud_session", JSON.stringify(s));
  } catch(e) { location.replace("login.html"); }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>DHSUD NIR — User Management</title>
<style>
  :root {
    --blue-700:#1f4e79; --blue-600:#2a6299; --blue-500:#4a90d9;
    --blue-100:#e8f1fb; --blue-50:#f4f8fd;
    --green-600:#1c8a4b; --green-100:#e3f6e8;
    --red-600:#c23b3b; --red-100:#fde7e7;
    --amber-500:#e08a00; --amber-100:#fff4e0;
    --ink-900:#0e1825; --ink-700:#2c3a4c; --ink-500:#5a6b80;
    --line:#dbe3ee; --bg:#eef2f8; --white:#fff;
    --shadow-md:0 4px 12px rgba(15,42,71,.08),0 1px 3px rgba(15,42,71,.05);
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body {
    margin:0; color:var(--ink-900); min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -220px,#dbe8f7 0%,transparent 70%),var(--bg);
  }
  header {
    background:linear-gradient(135deg,var(--blue-700) 0%,var(--blue-600) 100%);
    color:#fff; padding:14px 26px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 12px rgba(15,42,71,.18); position:sticky; top:0; z-index:20;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#fff 0%,#e8f1fb 100%);
    color:var(--blue-700); font-weight:800; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -2px 0 rgba(15,42,71,.12);
  }
  .brand-text { display:flex; flex-direction:column; line-height:1.1; }
  .brand-title { font-size:15px; font-weight:800; letter-spacing:.4px; }
  .brand-sub { font-size:11px; font-weight:600; color:rgba(255,255,255,.72); letter-spacing:.6px; text-transform:uppercase; }
  .nav-links { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .nav-links a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    padding:8px 14px; border-radius:999px;
  }
  .nav-links a:hover { background:rgba(255,255,255,.22); }

  .wrap { max-width:1000px; margin:26px auto 40px; padding:0 18px; }
  .card {
    background:var(--white); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow-md); border:1px solid rgba(219,227,238,.7);
    margin-bottom:22px;
  }
  h2 { margin:0 0 18px; font-size:17px; color:var(--blue-700); letter-spacing:-.2px; }
  h2 span { color:var(--ink-500); font-weight:600; font-size:13px; }

  label { display:block; font-size:12px; font-weight:800; margin:0 0 6px; color:var(--ink-700); letter-spacing:.03em; text-transform:uppercase; }
  input, select {
    width:100%; padding:11px 13px; border:1.5px solid #ccd9e8; border-radius:var(--radius-sm);
    font-size:14px; font-weight:600; color:var(--ink-900); background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:hover, select:hover { border-color:#b8cbe3; }
  input:focus, select:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(74,144,217,.18); }
  input[readonly] { background:#f7fafd; color:var(--ink-500); cursor:not-allowed; }

  .row { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
  .row.cols-3 { grid-template-columns:1fr 1fr 1fr; }
  .field { margin-bottom:14px; }

  .btn {
    cursor:pointer; border:0; border-radius:var(--radius-sm);
    padding:12px 22px; font-size:14px; font-weight:800;
    transition:filter .15s ease, transform .08s ease;
  }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary {
    background:linear-gradient(135deg,var(--blue-600),var(--blue-500)); color:#fff;
    box-shadow:0 4px 12px rgba(42,98,153,.28);
  }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.06); }
  .btn-ghost { background:#fff; border:1.5px solid #dbe3ee; color:var(--ink-700); }
  .btn-ghost:hover:not(:disabled) { background:#f7fafd; border-color:#b8cbe3; }
  .btn-danger { background:linear-gradient(180deg,#e05e5e,var(--red-600)); color:#fff; }
  .btn-danger:hover:not(:disabled) { filter:brightness(1.07); }
  .btn-sm { padding:6px 12px; font-size:12px; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  .table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--line); }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; min-width:780px; }
  thead th {
    background:linear-gradient(180deg,#f7fafd,#eef4fb);
    color:var(--ink-500); font-size:11px; font-weight:800;
    letter-spacing:.06em; text-transform:uppercase;
    padding:11px 10px; text-align:center; border-bottom:1.5px solid var(--line);
  }
  tbody td { padding:10px; border-bottom:1px solid #eef2f7; text-align:center; }
  tbody td.txt-left { text-align:left; }
  tbody tr:hover td { background:var(--blue-50); }
  tbody tr:last-child td { border-bottom:0; }

  .pw-cell {
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px; letter-spacing:.5px;
  }
  .pw-reveal {
    background:none; border:0; cursor:pointer; padding:2px 6px;
    color:var(--ink-500); border-radius:4px; font-size:13px;
  }
  .pw-reveal:hover { background:#f4f8fd; color:var(--blue-700); }

  .badge {
    display:inline-block; font-size:10px; font-weight:800;
    padding:3px 10px; border-radius:999px; letter-spacing:.05em;
    text-transform:uppercase;
  }
  .badge-admin  { background:#dbe8f7; color:var(--blue-700); }
  .badge-user   { background:#eef2f7; color:var(--ink-700); }
  .badge-active { background:var(--green-100); color:var(--green-600); }
  .badge-inactive { background:var(--red-100); color:var(--red-600); }
  .badge-primary { background:var(--amber-100); color:#7a4a00; }

  .empty { text-align:center; color:var(--ink-500); padding:36px 20px; font-style:italic; font-size:13px; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translate(-50%, 20px);
    background:#0f2a47; color:#fff; padding:14px 24px; border-radius:999px;
    font-size:14px; font-weight:700; box-shadow:0 10px 30px rgba(15,42,71,.35);
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
    max-width:calc(100vw - 48px);
  }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.success { background:linear-gradient(135deg,#1c8a4b,#22a35a); }
  .toast.error { background:linear-gradient(135deg,#b02a2a,#d9534f); }

  .loading-overlay {
    position:fixed; inset:0; background:rgba(15,42,71,.5);
    display:none; align-items:center; justify-content:center; z-index:200;
    backdrop-filter:blur(4px);
  }
  .loading-overlay.show { display:flex; }
  .loading-card {
    background:#fff; padding:24px 32px; border-radius:14px;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .loading-spinner {
    width:32px; height:32px; border:3px solid #dbe3ee;
    border-top-color:var(--blue-600); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { 100% { transform:rotate(360deg); } }
  .loading-text { font-size:14px; font-weight:700; color:var(--ink-700); }

  .hidden-form { display:none; }

  #fatal {
    display:none; background:#fde7e7; color:#9b1c1c; padding:12px;
    border-radius:10px; margin-bottom:14px; white-space:pre-wrap;
    font-family:monospace; border:1px solid #f3bcbc; font-size:13px;
  }

  @media (max-width:720px) {
    .row, .row.cols-3 { grid-template-columns:1fr; }
    .brand-sub { display:none; }
    .card { padding:18px; }
    header { padding:12px 16px; }
  }
</style>
</head>
<body>

<form id="userForm" method="POST" target="hidden_save" class="hidden-form">
  <input type="hidden" name="action" value="saveUser">
  <input type="hidden" name="isUpdate" id="f_isUpdate">
  <input type="hidden" name="username" id="f_username">
  <input type="hidden" name="password" id="f_password">
  <input type="hidden" name="role" id="f_role">
  <input type="hidden" name="name" id="f_name">
  <input type="hidden" name="active" id="f_active">
</form>
<iframe name="hidden_save" id="hidden_save" class="hidden-form"></iframe>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Loading…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<header>
  <div class="brand">
    <div class="brand-mark">DH</div>
    <div class="brand-text">
      <span class="brand-title">DHSUD NIR</span>
      <span class="brand-sub">User Management</span>
    </div>
  </div>
  <nav class="nav-links">
    <a href="kiosk.html">🏠 Kiosk</a>
    <a href="travel.html">✈️ Travel</a>
    <a href="skeletal.html">👥 Skeletal</a>
    <a href="generator.html">🖨️ DTR</a>
    <a href="leave.html">📋 Leave</a>
    <a href="payslip.html">💵 Payslip</a>
    <a href="index.html">⚙️ Admin</a>
    <a href="#" onclick="dhsudLogout(event)">🚪 Logout</a>
  </nav>
</header>

<div class="wrap">
  <div id="fatal"></div>

  <!-- User list -->
  <div class="card">
    <h2>User Accounts <span id="userCount"></span></h2>
    <div class="table-wrap">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Password</th>
            <th>Active</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Create / edit form -->
  <div class="card">
    <h2 id="formTitle">Create New User</h2>

    <div class="row cols-3">
      <div class="field">
        <label for="inUsername">Username</label>
        <input type="text" id="inUsername" placeholder="e.g. jdelacruz" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="inName">Display Name</label>
        <input type="text" id="inName" placeholder="e.g. Juan Dela Cruz">
      </div>
      <div class="field">
        <label for="inRole">Role</label>
        <select id="inRole">
          <option value="user">User (Travel + Kiosk only)</option>
          <option value="admin">Admin (All pages)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="inPassword">Password</label>
        <input type="text" id="inPassword" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="inActive">Status</label>
        <select id="inActive">
          <option value="yes">Active</option>
          <option value="no">Inactive (cannot log in)</option>
        </select>
      </div>
    </div>

    <p id="pwNote" style="font-size:12px; color:var(--ink-500); margin:-6px 0 14px; display:none;">
      ℹ️ Leave password blank to keep the current one when editing.
    </p>

    <div class="toolbar">
      <button class="btn btn-primary" id="btnSave" type="button">💾 Create User</button>
      <button class="btn btn-ghost" id="btnCancelEdit" type="button" style="display:none;">Cancel Edit</button>
    </div>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbxbm3rgbes2I5u9xR_FBMpD_ZXn5mQGTMD5C2vWDyPB_XY_sdu3TO-RXQxyFS93gwA/exec";

var allUsers     = [];
var editingUser  = null;   // username being edited, or null for create
var pendingAction = null;
var pendingTimer  = null;

/* ── Utilities ───────────────────────────────────────── */
function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = "toast"; }, 3000);
}
function showLoading(text) {
  document.getElementById("loadingText").textContent = text || "Loading…";
  document.getElementById("loadingOverlay").classList.add("show");
}
function hideLoading() { document.getElementById("loadingOverlay").classList.remove("show"); }
function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ── Fetch users (JSONP) ─────────────────────────────── */
function fetchUsers() {
  return new Promise(function(resolve) {
    var cbName = "jsonp_users_" + Math.random().toString(36).slice(2);
    var script = document.createElement("script");
    var done = false;
    function finish(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[cbName];
      resolve(r || []);
    }
    window[cbName] = function(data) {
      if (data && data.success && Array.isArray(data.data)) finish(data.data);
      else finish([]);
    };
    script.onerror = function() { finish([]); };
    var timer = setTimeout(function() { finish([]); }, 12000);
    script.src = API_URL + "?action=getUsers&callback=" + cbName;
    document.body.appendChild(script);
  });
}

function loadUsers(silent) {
  if (!silent) showLoading("Loading users…");
  return fetchUsers().then(function(users) {
    allUsers = users;
    if (!silent) hideLoading();
    renderUsers();
  });
}

/* ── Render user table ───────────────────────────────── */
function renderUsers() {
  var tbody = document.querySelector("#usersTable tbody");
  tbody.innerHTML = "";
  document.getElementById("userCount").textContent =
    allUsers.length === 0 ? "" : "(" + allUsers.length + ")";

  if (allUsers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No users yet. Create one below.</td></tr>';
    return;
  }

  allUsers.forEach(function(u) {
    var roleBadge  = u.role === "admin"
      ? '<span class="badge badge-admin">Admin</span>'
      : '<span class="badge badge-user">User</span>';
    var activeBadge = (u.active === "yes" || u.active === "true" || u.active === "1")
      ? '<span class="badge badge-active">Active</span>'
      : '<span class="badge badge-inactive">Inactive</span>';
    var primaryBadge = u.isPrimary
      ? ' <span class="badge badge-primary">Primary</span>'
      : '';
    var pwHidden = u.password
      ? '<span class="pw-cell" data-pw="' + escapeHtml(u.password) + '">••••••••</span>' +
        ' <button class="pw-reveal" data-reveal="1">👁</button>'
      : '<span style="color:var(--ink-500); font-style:italic;">(none)</span>';

    var actions = '<button class="btn btn-ghost btn-sm" data-edit="' + escapeHtml(u.username) + '">Edit</button>';
    if (!u.isPrimary) {
      actions += ' <button class="btn btn-danger btn-sm" data-delete="' + escapeHtml(u.username) + '">Del</button>';
    }

    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="txt-left"><b>' + escapeHtml(u.username) + '</b>' + primaryBadge + '</td>' +
      '<td class="txt-left">' + escapeHtml(u.name || "—") + '</td>' +
      '<td>' + roleBadge + '</td>' +
      '<td>' + pwHidden + '</td>' +
      '<td>' + activeBadge + '</td>' +
      '<td>' + actions + '</td>';
    tbody.appendChild(tr);
  });

  /* Password reveal toggles */
  tbody.querySelectorAll("button[data-reveal]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var span = btn.previousElementSibling;
      var pw = span.dataset.pw || "";
      if (btn.textContent === "👁") {
        span.textContent = pw;
        btn.textContent = "🙈";
      } else {
        span.textContent = "••••••••";
        btn.textContent = "👁";
      }
    });
  });

  /* Edit / Delete */
  tbody.querySelectorAll("button[data-edit]").forEach(function(b) {
    b.addEventListener("click", function(){ startEdit(b.dataset.edit); });
  });
  tbody.querySelectorAll("button[data-delete]").forEach(function(b) {
    b.addEventListener("click", function(){ deleteUser(b.dataset.delete); });
  });
}

/* ── Create / edit ──────────────────────────────────── */
function startEdit(username) {
  var u = allUsers.find(function(x){ return x.username.toLowerCase() === username.toLowerCase(); });
  if (!u) return;
  editingUser = u.username;

  document.getElementById("formTitle").textContent = "Edit User — " + u.username;
  document.getElementById("inUsername").value = u.username;
  document.getElementById("inUsername").readOnly = true;
  document.getElementById("inName").value = u.name || "";
  document.getElementById("inRole").value = u.role || "user";
  document.getElementById("inPassword").value = "";
  document.getElementById("inActive").value = (u.active === "yes" || u.active === "true" || u.active === "1") ? "yes" : "no";
  document.getElementById("pwNote").style.display = "block";
  document.getElementById("btnSave").textContent = "💾 Save Changes";
  document.getElementById("btnCancelEdit").style.display = "inline-flex";

  window.scrollTo({ top: document.getElementById("formTitle").getBoundingClientRect().top + window.scrollY - 60, behavior: "smooth" });
}

function resetForm() {
  editingUser = null;
  document.getElementById("formTitle").textContent = "Create New User";
  document.getElementById("inUsername").value = "";
  document.getElementById("inUsername").readOnly = false;
  document.getElementById("inName").value = "";
  document.getElementById("inRole").value = "user";
  document.getElementById("inPassword").value = "";
  document.getElementById("inActive").value = "yes";
  document.getElementById("pwNote").style.display = "none";
  document.getElementById("btnSave").textContent = "💾 Create User";
  document.getElementById("btnCancelEdit").style.display = "none";
}

document.getElementById("btnCancelEdit").addEventListener("click", function(){
  resetForm();
  showToast("Edit cancelled.", "");
});

/* ── Submit ──────────────────────────────────────────── */
function submitUser(payload) {
  var f = document.getElementById("userForm");
  document.getElementById("f_isUpdate").value = payload.isUpdate ? "1" : "";
  document.getElementById("f_username").value = payload.username;
  document.getElementById("f_password").value = payload.password;
  document.getElementById("f_role").value = payload.role;
  document.getElementById("f_name").value = payload.name;
  document.getElementById("f_active").value = payload.active;
  f.action = API_URL;
  f.submit();
}

function submitDelete(username) {
  var f = document.getElementById("userForm");
  document.getElementById("f_isUpdate").value = "";
  document.getElementById("f_username").value = username;
  /* Override the action field for delete */
  var oldAction = f.action;
  var actionInput = f.querySelector("input[name='action']");
  var oldActionValue = actionInput.value;
  actionInput.value = "deleteUser";
  f.action = API_URL;
  f.submit();
  /* Restore for future use */
  setTimeout(function() { actionInput.value = oldActionValue; f.action = oldAction; }, 100);
}

document.getElementById("btnSave").addEventListener("click", function() {
  var username = document.getElementById("inUsername").value.trim().toLowerCase();
  var name     = document.getElementById("inName").value.trim();
  var role     = document.getElementById("inRole").value;
  var password = document.getElementById("inPassword").value;
  var active   = document.getElementById("inActive").value;

  if (!username) return showToast("⚠ Username is required.", "error");
  if (!/^[a-z0-9_.\-]{3,32}$/.test(username)) {
    return showToast("⚠ Username must be 3–32 chars: letters, numbers, dot, dash, underscore.", "error");
  }
  if (!editingUser && !password) return showToast("⚠ Password is required for new users.", "error");
  if (password && password.length < 6) return showToast("⚠ Password must be at least 6 characters.", "error");

  /* When editing, verify the new username doesn't collide (shouldn't happen since it's readonly) */
  if (!editingUser && allUsers.some(function(u){ return u.username.toLowerCase() === username; })) {
    return showToast("⚠ Username already exists.", "error");
  }

  showLoading(editingUser ? "Updating user…" : "Creating user…");
  pendingAction = { type: editingUser ? "update" : "create", username: username };
  submitUser({
    isUpdate: !!editingUser,
    username: username,
    password: password,
    role: role,
    name: name,
    active: active
  });
  setTimeout(hideLoading, 800);
});

function deleteUser(username) {
  if (!confirm("Delete user \"" + username + "\"?\n\nThis cannot be undone.")) return;
  showLoading("Deleting user…");
  pendingAction = { type: "delete", username: username };
  submitDelete(username);
  setTimeout(hideLoading, 800);
}

/* ── Iframe save handler ─────────────────────────────── */
document.getElementById("hidden_save").onload = function() {
  if (!pendingAction) return;
  var action = pendingAction;

  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(function() {
    loadUsers(true).then(function() {
      if (action.type === "create") {
        var exists = allUsers.some(function(u){ return u.username.toLowerCase() === action.username.toLowerCase(); });
        if (exists) { showToast("✅ User created.", "success"); resetForm(); }
        else showToast("⚠ Create may have failed — refresh.", "error");
      } else if (action.type === "update") {
        showToast("✅ User updated.", "success");
        resetForm();
      } else if (action.type === "delete") {
        var still = allUsers.some(function(u){ return u.username.toLowerCase() === action.username.toLowerCase(); });
        if (!still) showToast("✅ User deleted.", "success");
        else showToast("⚠ Delete may have failed — refresh.", "error");
      }
      pendingAction = null;
    });
  }, 1000);
};

/* ── Logout ──────────────────────────────────────────── */
function dhsudLogout(e) {
  if (e) e.preventDefault();
  if (!confirm("Log out of the DHSUD NIR system?")) return;
  localStorage.removeItem("dhsud_session");
  location.href = "login.html";
}

/* Show logged-in user in nav */
(function(){
  try {
    var s = JSON.parse(localStorage.getItem("dhsud_session") || "null");
    if (s && s.user) {
      var nav = document.querySelector(".nav-links");
      if (nav) {
        var badge = document.createElement("span");
        badge.style.cssText = "color:rgba(255,255,255,.85); font-size:12px; font-weight:700; padding:8px 12px;";
        badge.textContent = "👤 " + (s.name || s.user);
        nav.insertBefore(badge, nav.firstChild);
      }
    }
  } catch(e){}
})();

/* ── Boot ────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", function() {
  resetForm();
  loadUsers();
});
</script>
