<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003087">
<title>DHSUD NIR — Kiosk</title>
<style>
  :root {
    --blue:#003087; --blue-600:#0038A8; --accent:#2a6fc9;
    --blue-50:#f5f8fd; --blue-100:#e6eefc;
    --ink-700:#2c3a4c; --ink-500:#5a6b80; --line:#dbe3ee;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body { margin:0; background:#eef2f7; color:#1a1a1a; }

  /* ════════ GOVERNMENT MASTHEAD ════════ */
  .gov-header {
    background:#fff; border-bottom:3px solid #0038A8;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 12px rgba(0,26,77,.10);
  }
  .gov-flag-strip {
    height:5px;
    background:linear-gradient(to right,
      #0038A8 0% 33.33%,
      #CE1126 33.33% 66.66%,
      #FCD116 66.66% 100%);
  }
  .gov-masthead {
    max-width:1200px; margin:0 auto; padding:12px 26px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .gov-seal { width:62px; height:62px; flex-shrink:0;
    filter:drop-shadow(0 1px 2px rgba(0,26,77,.18)); }
  .gov-seal img { display:block; width:100%; height:100%; object-fit:contain; }
  .gov-masthead-text { flex:1; min-width:260px; line-height:1.2; }
  .gov-republic {
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#5a6b80; font-weight:600; margin-bottom:3px;
  }
  .gov-dept-name {
    margin:0; font-size:17px; font-weight:800; color:#001a4d;
    font-family:Georgia,"Times New Roman",serif;
    line-height:1.15; letter-spacing:-.2px;
  }
  .gov-region {
    margin-top:3px; font-size:12px; font-weight:700; color:#0038A8;
    letter-spacing:.12em; text-transform:uppercase;
    font-family:Georgia,"Times New Roman",serif;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .gov-module {
    display:inline-block; padding:2px 8px;
    background:#0038A8; color:#FCD116; border-radius:3px;
    font-size:9.5px; font-weight:800; letter-spacing:.1em;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    text-transform:uppercase;
  }
  .gov-nav { display:flex; gap:6px; flex-wrap:wrap; }
  .gov-nav a {
    color:#0038A8; background:#f4f8fd;
    border:1px solid #c9d8ec; border-radius:6px;
    padding:8px 13px; font-size:12.5px; font-weight:700;
    text-decoration:none; white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .gov-nav a:hover { background:#0038A8; color:#fff; border-color:#0038A8; }

  .wrap { max-width:680px; margin:22px auto; padding:0 16px; }
  .card { background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:22px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom:14px; }
  .card-header h2 { margin:0; font-size:17px; color:var(--blue); }
  .btn-refresh { background:none; border:none; color:var(--blue); font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:4px; }
  .btn-refresh:hover { background:var(--blue-50); }
  .btn-refresh.loading { opacity: 0.5; pointer-events: none; }
  .btn-refresh.loading span { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  select { width:100%; padding:14px; border:1px solid #ccd5e0; border-radius:6px; font-size:16px; background:#fff; }
  .clock { font-size:48px; font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums; text-align:center; margin:6px 0 4px; }
  .date { text-align:center; color:#5a6b80; margin-bottom:16px; font-size:14px; }
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  button { cursor:pointer; border:0; border-radius:6px; padding:16px; font-size:16px; font-weight:600; }
  .btn-am { background:#d4e2f5; color:#003087; }
  .btn-pm { background:#ffe0b3; color:#7a4a00; }
  button:hover:not(:disabled) { filter:brightness(.95); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:16px; padding:14px; border-radius:6px; font-size:15px; display:none; text-align:center; font-weight:600; }
  .ok { background:#e3f6e8; color:#1c6b32; display:block!important; }
  .err { background:#fde7e7; color:#9b1c1c; display:block!important; }
  #fatal { display:none; background:#fde7e7; color:#9b1c1c; padding:12px; border-radius:6px; margin:10px 0; white-space:pre-wrap; font-family:monospace; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:10px; }
  th,td { border:1px solid #d9e1ea; padding:8px; text-align:center; }
  th { background:#f3f6fa; }
  .muted { color:#6b7a8d; font-size:13px; text-align:center; margin-top:14px; }
  .override-box { margin-top: 15px; background: #fff3cd; padding: 12px; border-radius: 6px; border: 1px solid #ffe08a; display: flex; align-items: center; gap: 10px; }
  .override-box input { width: 20px; height: 20px; cursor: pointer; }
  .override-box label { margin: 0; font-size: 14px; color: #664d03; cursor: pointer; }
  .hidden-iframe { display:none; }

  @media (max-width:860px) {
    .gov-masthead { padding:10px 16px; gap:12px; }
    .gov-seal { width:50px; height:50px; }
    .gov-dept-name { font-size:14.5px; }
    .gov-region { font-size:10.5px; }
    .gov-nav { width:100%; }
    .gov-nav a { font-size:11.5px; padding:7px 11px; }
  }
</style>
</head>
<body>

<form id="saveForm" method="POST" target="hidden_post_iframe" class="hidden-iframe">
  <input type="hidden" name="action" value="saveLog">
  <input type="hidden" name="date" id="f_date">
  <input type="hidden" name="code" id="f_code">
  <input type="hidden" name="name" id="f_name">
  <input type="hidden" name="am_in" id="f_am_in">
  <input type="hidden" name="am_out" id="f_am_out">
  <input type="hidden" name="pm_in" id="f_pm_in">
  <input type="hidden" name="pm_out" id="f_pm_out">
</form>
<iframe name="hidden_post_iframe" id="hidden_post_iframe" class="hidden-iframe"></iframe>

<header class="gov-header">
  <div class="gov-flag-strip" aria-hidden="true"></div>
  <div class="gov-masthead">
   <div class="gov-seal" aria-hidden="true">
  <img src="dhsud-logo.png" alt="Department of Human Settlements and Urban Development">
</div>
    <div class="gov-masthead-text">
      <div class="gov-republic">Republic of the Philippines</div>
      <div class="gov-dept-name">Department of Human Settlements and Urban Development</div>
      <div class="gov-region">
        Negros Island Region
        <span class="gov-module">Time Kiosk</span>
      </div>
    </div>
    <nav class="gov-nav">
      <a href="generator.html">🖨️ Print DTR</a>
      <a href="index.html">⚙️ Admin</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="fatal"></div>
  <div class="card">
    <div class="clock" id="liveClock">--:--:--</div>
    <div class="date" id="liveDate">—</div>
    <label for="employee">Select Employee</label>
    <select id="employee"><option value="">— Tap here to select your name —</option></select>
    <div class="override-box">
      <input type="checkbox" id="halfDay">
      <label for="halfDay">Check this box for Half-Day (skip AM)</label>
    </div>
    <div class="grid4">
      <button type="button" class="btn-am" id="btn-am-in">🟦 AM — Time In</button>
      <button type="button" class="btn-am" id="btn-am-out">🟦 AM — Time Out</button>
      <button type="button" class="btn-pm" id="btn-pm-in">🟧 PM — Time In</button>
      <button type="button" class="btn-pm" id="btn-pm-out">🟧 PM — Time Out</button>
    </div>
    <div id="status"></div>
    <div class="muted">Timestamps are taken automatically from this computer's clock.<br>Office hours: <b>7:00 AM – 6:00 PM</b>.</div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Today's Log — <span id="todayLabel"></span></h2>
      <button class="btn-refresh" id="btn-refresh" onclick="fetchLogsJSONP()">
        <span>🔄</span> Refresh
      </button>
    </div>
    <table id="todayTable">
      <thead><tr><th>Employee</th><th>AM In</th><th>AM Out</th><th>PM In</th><th>PM Out</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzbup1x4BWZsy-N5DejhBs7L4NHjeHDN4UnmT9U-1khpexgtR7E5G9MN3kT3s2pXd63/exec";

/* ─── Fallback list — used only if the Employees sheet isn't reachable yet ─── */
var FALLBACK_EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Adrian Gallego" }, { code:"22", name:"Jelly Mae B. Benotapa" }, { code:"23", name:"Xenia Santillan" }
];

/* Active list — replaced with sheet data once loaded. */
var employees = FALLBACK_EMPLOYEES.slice();

function getTodayString() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
}
function getCurrentTimeString() {
  var d = new Date();
  return d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true });
}

/* ─────────── EMPLOYEES FETCH ─────────── */
function fetchEmployees() {
  return new Promise(function(resolve) {
    var cbName = "jsonp_kiosk_emp_" + Math.random().toString(36).slice(2);
    var script = document.createElement("script");
    var done = false;
    function finish(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[cbName];
      resolve(r);
    }
    window[cbName] = function(data) {
      if (data && data.success && Array.isArray(data.data)) {
        var cleaned = data.data
          .filter(function(e){ return e && e.code && e.name; })
          .map(function(e){ return { code: String(e.code).padStart(2,"0"), name: String(e.name) }; });
        finish(cleaned);
      } else {
        finish(null);
      }
    };
    script.onerror = function() { finish(null); };
    var timer = setTimeout(function() { finish(null); }, 12000);
    script.src = API_URL + "?action=getEmployees&callback=" + cbName;
    document.body.appendChild(script);
  });
}

document.addEventListener("DOMContentLoaded", function () {
  var sel = document.getElementById("employee");
  var statusBox = document.getElementById("status");

  function tickClock(){
    var now = new Date();
    document.getElementById("liveClock").textContent = now.toLocaleTimeString("en-US");
    document.getElementById("liveDate").textContent = now.toLocaleDateString("en-US", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  }
  setInterval(tickClock, 1000); tickClock();

  function populateDropdown() {
    var current = sel.value;
    sel.innerHTML = '<option value="">— Tap here to select your name —</option>';
    employees.forEach(function(e){
      var o = document.createElement("option");
      o.value = e.code;
      o.textContent = e.code + " — " + e.name;
      sel.appendChild(o);
    });
    /* Restore selection if the code still exists */
    if (current && employees.some(function(e){ return e.code === current; })) {
      sel.value = current;
    }
  }

  var SLOT_LABELS = { am_in:"AM Time In", am_out:"AM Time Out", pm_in:"PM Time In", pm_out:"PM Time Out" };
  var cachedLogs = {};
  var pending = null;

  function showMsg(cls, text){
    statusBox.className = cls; statusBox.textContent = text;
  }
  function shallowClone(o){
    var c = {};
    for (var k in o) if (o.hasOwnProperty(k)) c[k] = o[k];
    return c;
  }
  function applyPendingOverlay(raw){
    var display = shallowClone(raw || {});
    if (pending) {
      var cur = display[pending.code] ? shallowClone(display[pending.code]) : { name: pending.name };
      if (!cur[pending.slot]) cur[pending.slot] = pending.time;
      if (!cur.name) cur.name = pending.name;
      display[pending.code] = cur;
    }
    return display;
  }

  window.fetchLogsJSONP = function(onDone, silent){
    var todayStr = getTodayString();
    document.getElementById("todayLabel").textContent = todayStr;
    var tbody = document.querySelector("#todayTable tbody");
    if (!silent) tbody.innerHTML = '<tr><td colspan="5" class="muted">Loading records...</td></tr>';

    var btn = document.getElementById("btn-refresh");
    if (!silent) btn.classList.add("loading");

    var callbackName = "jsonp_" + Math.round(100000 * Math.random());
    var script = document.createElement("script");
    var done = false;

    function finish(errMsg, rawData){
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (errMsg && !silent) {
        tbody.innerHTML = '<tr><td colspan="5" class="err">Error: ' + errMsg + '</td></tr>';
      }
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[callbackName];
      if (!silent) btn.classList.remove("loading");
      if (typeof onDone === "function") onDone(rawData);
    }

    window[callbackName] = function(data){
      if (data && data.success) {
        var raw = data.data || {};
        cachedLogs = applyPendingOverlay(raw);
        renderToday();
        refreshButtons();
        finish(null, raw);
      } else {
        finish((data && data.error) || "Backend returned an error");
      }
    };

    script.onerror = function(){
      finish("Could not load backend. Verify the /exec URL and that the Web App is deployed as 'Anyone, even anonymous'.");
    };
    var timer = setTimeout(function(){
      finish("Backend did not respond within 12s.");
    }, 12000);

    script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(todayStr) + "&callback=" + callbackName;
    document.body.appendChild(script);
  };

  document.getElementById("hidden_post_iframe").onload = function(){
    if (!pending) return;
    var saved = pending;
    var attemptsLeft = 2;
    function verify(){
      window.fetchLogsJSONP(function(rawData){
        var raw = rawData || {};
        var rec = raw[saved.code] || {};
        if (rec[saved.slot] === saved.time) {
          showMsg("ok", "✅ " + saved.name + " — " + SLOT_LABELS[saved.slot] + " at " + saved.time);
          pending = null;
          if (saved.slot === "pm_in") document.getElementById("halfDay").checked = false;
          refreshButtons();
          return;
        }
        attemptsLeft--;
        if (attemptsLeft > 0) {
          setTimeout(verify, 1500);
        } else {
          pending = null;
          showMsg("err", "⚠ Save was not confirmed by the server. Please refresh and try again.");
          window.fetchLogsJSONP();
        }
      }, true);
    }
    setTimeout(verify, 1200);
  };

  function punch(slot){
    if (pending) return showMsg("err", "Please wait — the previous save is being confirmed.");

    var code = sel.value;
    var isHalfDay = document.getElementById("halfDay").checked;
    if (!code) return showMsg("err", "Please select an employee first.");

    var todayStr = getTodayString();
    var currentTimeStr = getCurrentTimeString();
    var rec = cachedLogs[code] || {};

    if (slot === "am_in") {
      if (isHalfDay) return showMsg("err", "AM is blocked for Half-Day.");
      if (rec.am_in) return showMsg("err", "AM Time In already recorded.");
    } else if (slot === "am_out") {
      if (isHalfDay) return showMsg("err", "AM is blocked for Half-Day.");
      if (!rec.am_in) return showMsg("err", "Please log AM Time In first.");
      if (rec.am_out) return showMsg("err", "AM Time Out already recorded.");
    } else if (slot === "pm_in") {
      if (rec.pm_in) return showMsg("err", "PM Time In already recorded.");
      if (!isHalfDay && !rec.am_out) return showMsg("err", "Please log AM Time Out first (or check Half-Day).");
    } else if (slot === "pm_out") {
      if (!rec.pm_in) return showMsg("err", "Please log PM Time In first.");
      if (rec.pm_out) return showMsg("err", "PM Time Out already recorded.");
    }

    var emp = employees.find(function(e){ return e.code === code; });
    if (!emp) return showMsg("err", "Employee " + code + " is not in the list. Please refresh.");

    var toSave = {
      am_in: rec.am_in || "", am_out: rec.am_out || "",
      pm_in: rec.pm_in || "", pm_out: rec.pm_out || ""
    };
    toSave[slot] = currentTimeStr;

    document.getElementById("f_date").value   = todayStr;
    document.getElementById("f_code").value   = code;
    document.getElementById("f_name").value   = emp.name;
    document.getElementById("f_am_in").value  = toSave.am_in;
    document.getElementById("f_am_out").value = toSave.am_out;
    document.getElementById("f_pm_in").value  = toSave.pm_in;
    document.getElementById("f_pm_out").value = toSave.pm_out;

    pending = { slot: slot, code: code, time: currentTimeStr, name: emp.name };

    var optimistic = shallowClone(rec);
    optimistic[slot] = currentTimeStr;
    if (!optimistic.name) optimistic.name = emp.name;
    cachedLogs[code] = optimistic;

    showMsg("ok", "⏳ Saving " + emp.name + " — " + SLOT_LABELS[slot] + "...");
    renderToday();
    refreshButtons();

    document.getElementById("saveForm").action = API_URL;
    document.getElementById("saveForm").submit();
  }

  function refreshButtons(){
    var code = sel.value;
    var isHalfDay = document.getElementById("halfDay").checked;
    var rec = cachedLogs[code] || {};

    document.getElementById("btn-am-in").disabled  = isHalfDay || !!rec.am_in;
    document.getElementById("btn-am-out").disabled = isHalfDay || !rec.am_in || !!rec.am_out;
    document.getElementById("btn-pm-in").disabled  = !!rec.pm_in || (!isHalfDay && !rec.am_out);
    document.getElementById("btn-pm-out").disabled = !rec.pm_in || !!rec.pm_out;
  }

  function renderToday(){
    var tbody = document.querySelector("#todayTable tbody");
    tbody.innerHTML = "";
    var rows = 0;
    employees.forEach(function(e){
      var r = cachedLogs[e.code];
      if (!r) return;
      if (!r.am_in && !r.am_out && !r.pm_in && !r.pm_out) return;
      var tr = document.createElement("tr");
      tr.innerHTML = '<td style="text-align:left">' + e.name + '</td>' +
        '<td>' + (r.am_in || "-") + '</td><td>' + (r.am_out || "-") + '</td>' +
        '<td>' + (r.pm_in || "-") + '</td><td>' + (r.pm_out || "-") + '</td>';
      tbody.appendChild(tr);
      rows++;
    });
    if (!rows) tbody.innerHTML = '<tr><td colspan="5" class="muted">No entries yet today.</td></tr>';
  }

  document.getElementById("btn-am-in").addEventListener("click",  function(){ punch("am_in");  });
  document.getElementById("btn-am-out").addEventListener("click", function(){ punch("am_out"); });
  document.getElementById("btn-pm-in").addEventListener("click",  function(){ punch("pm_in");  });
  document.getElementById("btn-pm-out").addEventListener("click", function(){ punch("pm_out"); });

  sel.addEventListener("change", function(){
    refreshButtons();
    statusBox.className = "";
  });
  document.getElementById("halfDay").addEventListener("change", refreshButtons);

  /* ─── BOOT SEQUENCE: employees → dropdown → today's logs ─── */
  showMsg("ok", "⏳ Loading employees…");
  fetchEmployees().then(function(list) {
    if (list) {
      employees = list.length > 0 ? list : FALLBACK_EMPLOYEES.slice();
    } else {
      employees = FALLBACK_EMPLOYEES.slice(); // backend not ready — use fallback
    }
    populateDropdown();
    showMsg("", "");
    window.fetchLogsJSONP();
  });
});
</script>
</body>
</html>
