<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>DHSUD NIR — Time Kiosk</title>
<style>
  :root {
    --blue-900:#0f2a47; --blue-800:#163a5f; --blue-700:#1f4e79;
    --blue-600:#2a6299; --blue-500:#4a90d9; --blue-100:#e8f1fb; --blue-50:#f4f8fd;
    --amber-500:#e08a00; --amber-100:#fff4e0;
    --green-600:#1c8a4b; --green-100:#e3f6e8;
    --red-600:#c23b3b; --red-100:#fde7e7;
    --ink-900:#0e1825; --ink-700:#2c3a4c; --ink-500:#5a6b80; --ink-300:#95a3b6;
    --line:#dbe3ee; --bg:#eef2f8; --white:#fff;
    --shadow-sm:0 1px 2px rgba(15,42,71,.06),0 1px 3px rgba(15,42,71,.04);
    --shadow-md:0 4px 12px rgba(15,42,71,.08),0 1px 3px rgba(15,42,71,.05);
    --shadow-lg:0 10px 30px rgba(15,42,71,.12),0 4px 10px rgba(15,42,71,.06);
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; color:var(--ink-900); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -220px, #dbe8f7 0%, transparent 70%),
      var(--bg);
  }

  /* ── Header ─────────────────────────────────────── */
  header {
    background:linear-gradient(135deg, var(--blue-700) 0%, var(--blue-600) 100%);
    color:#fff; padding:14px 26px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 12px rgba(15,42,71,.18);
    position:sticky; top:0; z-index:20;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#fff 0%,#e8f1fb 100%);
    color:var(--blue-700); font-weight:800; font-size:15px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -2px 0 rgba(15,42,71,.12);
  }
  .brand-text { display:flex; flex-direction:column; line-height:1.1; }
  .brand-title { font-size:15px; font-weight:800; letter-spacing:.4px; }
  .brand-sub   { font-size:11px; font-weight:600; color:rgba(255,255,255,.72); letter-spacing:.6px; text-transform:uppercase; }
  .nav-links { display:flex; gap:8px; }
  .nav-links a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    padding:8px 14px; border-radius:999px; transition:background .15s ease, border-color .15s ease;
  }
  .nav-links a:hover { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.34); }

  /* ── Layout ─────────────────────────────────────── */
  .wrap { max-width:820px; margin:26px auto 40px; padding:0 18px; }
  .card {
    background:var(--white); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow-md); border:1px solid rgba(219,227,238,.7);
    margin-bottom:22px; animation:fadeUp .4s ease both;
  }
  .card + .card { animation-delay:.05s; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-header h2 { margin:0; font-size:17px; color:var(--blue-700); letter-spacing:-.2px; }
  .card-header h2 span { color:var(--ink-500); font-weight:600; font-size:14px; }

  /* ── Clock panel ────────────────────────────────── */
  .clock-panel {
    background:linear-gradient(180deg, #f4f8fd 0%, #e9f2fc 100%);
    border:1px solid #d5e6f7; border-radius:var(--radius-sm);
    padding:18px 20px 14px; text-align:center; margin-bottom:22px;
    position:relative; overflow:hidden;
  }
  .clock-panel::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 130%, rgba(74,144,217,.20), transparent 60%);
  }
  .live-badge {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:800; letter-spacing:.8px;
    color:var(--green-600); background:rgba(28,138,75,.10);
    padding:4px 10px; border-radius:999px; margin-bottom:6px;
  }
  .live-dot {
    width:7px; height:7px; border-radius:50%; background:#21c064;
    box-shadow:0 0 0 0 rgba(33,192,100,.55); animation:pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow:0 0 0 0 rgba(33,192,100,.55); }
    70%  { box-shadow:0 0 0 8px rgba(33,192,100,0); }
    100% { box-shadow:0 0 0 0 rgba(33,192,100,0); }
  }
  .clock {
    font-size:54px; font-weight:800; letter-spacing:-1.5px;
    font-variant-numeric:tabular-nums; line-height:1.05;
    background:linear-gradient(180deg, var(--blue-700), var(--blue-500));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    position:relative; z-index:1;
  }
  .date { text-align:center; color:var(--ink-500); font-size:14px; font-weight:600; margin-top:2px; position:relative; z-index:1; }

  /* ── Form controls ──────────────────────────────── */
  label { display:block; font-size:13px; font-weight:700; margin:0 0 6px; color:var(--ink-700); }
  select {
    width:100%; padding:15px 48px 15px 16px; font-size:16px; font-weight:600;
    border:1.5px solid #ccd9e8; border-radius:var(--radius-sm); background-color:#fff; color:var(--ink-900);
    appearance:none; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%231f4e79' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 16px center; background-size:18px;
  }
  select:hover { border-color:#a9c2df; }
  select:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(74,144,217,.18); }

  /* ── Half-day toggle card ───────────────────────── */
  .override-box {
    display:flex; align-items:center; gap:14px; margin-top:16px; padding:14px 16px;
    background:linear-gradient(180deg, #fffbf0 0%, #fff5e0 100%);
    border:1px solid #ffe0a3; border-radius:var(--radius-sm);
    cursor:pointer; transition:box-shadow .15s ease;
  }
  .override-box:hover { box-shadow:0 0 0 4px rgba(224,138,0,.08); }
  .override-box input { width:22px; height:22px; margin:0; cursor:pointer; accent-color:var(--amber-500); flex-shrink:0; }
  .override-box label { margin:0; font-size:14px; color:#7a4a00; cursor:pointer; font-weight:600; }

  /* ── Punch buttons ──────────────────────────────── */
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px; }
  button {
    cursor:pointer; border:0; border-radius:var(--radius-sm); padding:20px 14px;
    font-size:16px; font-weight:700; letter-spacing:.1px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn-am {
    background:linear-gradient(180deg, #e6f2ff 0%, #cfe4ff 100%);
    color:#0b3d75; border:1.5px solid #b3d4f5;
    box-shadow:0 2px 0 rgba(11,61,117,.06), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-am:hover:not(:disabled) {
    background:linear-gradient(180deg, #d8ebff 0%, #bcd9ff 100%);
    box-shadow:0 4px 10px rgba(11,61,117,.12), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-pm {
    background:linear-gradient(180deg, #fff1dd 0%, #ffe0b3 100%);
    color:#7a4a00; border:1.5px solid #f5c68a;
    box-shadow:0 2px 0 rgba(122,74,0,.06), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-pm:hover:not(:disabled) {
    background:linear-gradient(180deg, #ffe8c9 0%, #ffd59a 100%);
    box-shadow:0 4px 10px rgba(122,74,0,.12), inset 0 1px 0 rgba(255,255,255,.6);
  }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled {
    opacity:.4; cursor:not-allowed; filter:grayscale(.35);
    box-shadow:none;
  }

  /* ── Status ─────────────────────────────────────── */
  #status {
    display:none; margin-top:18px; padding:14px 18px; border-radius:var(--radius-sm);
    font-size:15px; font-weight:700; text-align:center;
  }
  #status.ok  { display:block; background:linear-gradient(180deg,#e8f8ec,#d9f1e1); color:#176a3b; border:1px solid #b8e5c6; animation:slideIn .25s ease both; }
  #status.err { display:block; background:linear-gradient(180deg,#fdecec,#fbe0e0); color:#a92424; border:1px solid #f3bcbc; animation:slideIn .25s ease both; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }

  .muted { color:var(--ink-500); font-size:13px; text-align:center; margin-top:16px; line-height:1.5; }
  .muted b { color:var(--ink-700); }

  /* ── Refresh button ─────────────────────────────── */
  .btn-refresh {
    background:var(--blue-50); border:1px solid #d5e3f3; color:var(--blue-700);
    font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px; transition:background .15s ease;
  }
  .btn-refresh:hover { background:var(--blue-100); }
  .btn-refresh.loading { opacity:.55; pointer-events:none; }
  .btn-refresh.loading span { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { 100% { transform:rotate(360deg); } }

  /* ── Table ──────────────────────────────────────── */
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; margin-top:6px; }
  thead th {
    background:linear-gradient(180deg,#f7fafd,#eef4fb);
    color:var(--ink-500); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    padding:11px 10px; text-align:center;
    border-bottom:1.5px solid var(--line);
  }
  thead th:first-child { border-top-left-radius:10px; }
  thead th:last-child  { border-top-right-radius:10px; }
  tbody td { padding:11px 10px; text-align:center; border-bottom:1px solid #eef2f7; }
  tbody td:first-child { text-align:left; font-weight:600; color:var(--ink-900); }
  tbody tr:nth-child(even) td { background:#fafcff; }
  tbody tr:hover td { background:var(--blue-50); }
  tbody tr:last-child td { border-bottom:0; }

  /* ── Fatal banner ───────────────────────────────── */
  #fatal { display:none; background:#fde7e7; color:#9b1c1c; padding:12px; border-radius:10px; margin-bottom:14px; white-space:pre-wrap; font-family:monospace; border:1px solid #f3bcbc; }

  .hidden-iframe { display:none; }

  /* ── Responsive ─────────────────────────────────── */
  @media (max-width:560px) {
    .clock { font-size:40px; }
    .grid4 { grid-template-columns:1fr; }
    .brand-sub { display:none; }
    .card { padding:20px; }
    header { padding:12px 16px; }
    .nav-links a { padding:7px 12px; font-size:12px; }
  }
</style>
</head>
<body>

<form id="saveForm" method="POST" target="hidden_post_iframe" class="hidden-iframe">
  <input type="hidden" name="action" value="saveLog">
  <input type="hidden" name="date" id="f_date">
  <input type="hidden" name="code" id="f_code">
  <input type="hidden" name="name" id="f_name">
  <input type="hidden" name="am_in" id="f_am_in">
  <input type="hidden" name="am_out" id="f_am_out">
  <input type="hidden" name="pm_in" id="f_pm_in">
  <input type="hidden" name="pm_out" id="f_pm_out">
</form>
<iframe name="hidden_post_iframe" id="hidden_post_iframe" class="hidden-iframe"></iframe>

<header>
  <div class="brand">
    <div class="brand-mark">DH</div>
    <div class="brand-text">
      <span class="brand-title">DHSUD NIR</span>
      <span class="brand-sub">Time Kiosk</span>
    </div>
  </div>
  <nav class="nav-links">
     <a href="skeletal.html">👥 Skeletal</a>
    <a href="generator.html">🖨️ Print DTR</a>
    <a href="index.html">⚙️ Admin</a>
  </nav>
</header>

<div class="wrap">
  <div id="fatal"></div>

  <div class="card">
    <div class="clock-panel">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      <div class="clock" id="liveClock">--:--:--</div>
      <div class="date" id="liveDate">—</div>
    </div>

    <label for="employee">Select Employee</label>
    <select id="employee"><option value="">— Tap here to select your name —</option></select>

    <div class="override-box">
      <input type="checkbox" id="halfDay">
      <label for="halfDay">Half-Day — skip AM session</label>
    </div>

    <div class="grid4">
      <button type="button" class="btn-am" id="btn-am-in">☀️ AM · Time In</button>
      <button type="button" class="btn-am" id="btn-am-out">☀️ AM · Time Out</button>
      <button type="button" class="btn-pm" id="btn-pm-in">🌙 PM · Time In</button>
      <button type="button" class="btn-pm" id="btn-pm-out">🌙 PM · Time Out</button>
    </div>

    <div id="status"></div>
    <div class="muted">
      Timestamps are taken automatically from this computer's clock.<br>
      Office hours: <b>7:00 AM – 6:00 PM</b>.
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Today's Log — <span id="todayLabel"></span></h2>
      <button class="btn-refresh" id="btn-refresh" onclick="fetchLogsJSONP()">
        <span>🔄</span> Refresh
      </button>
    </div>
    <table id="todayTable">
      <thead><tr><th>Employee</th><th>AM In</th><th>AM Out</th><th>PM In</th><th>PM Out</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyb-FV2-lV_DKEVDmXJ6JmII-hxfQza-ewMRA7ICihi7wY3P0Ppvd4DjKwwu3NGzu8I/exec";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Gallego" }
];

function getTodayString() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
}

function getCurrentTimeString() {
  var d = new Date();
  return d.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit', hour12: true });
}

document.addEventListener("DOMContentLoaded", function () {
  function tickClock(){
    var now = new Date();
    document.getElementById("liveClock").textContent = now.toLocaleTimeString("en-US");
    document.getElementById("liveDate").textContent = now.toLocaleDateString("en-US", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  }
  setInterval(tickClock, 1000); tickClock();

  var sel = document.getElementById("employee");
  EMPLOYEES.forEach(function(e){
    var o = document.createElement("option");
    o.value = e.code; o.textContent = e.code + " — " + e.name;
    sel.appendChild(o);
  });

  var SLOT_LABELS = { am_in:"AM Time In", am_out:"AM Time Out", pm_in:"PM Time In", pm_out:"PM Time Out" };
  var cachedLogs = {};
  var pending = null;

  function showMsg(cls, text){
    var box = document.getElementById("status");
    box.className = cls; box.textContent = text;
  }

  function shallowClone(o){
    var c = {};
    for (var k in o) if (o.hasOwnProperty(k)) c[k] = o[k];
    return c;
  }

  function applyPendingOverlay(raw){
    var display = shallowClone(raw || {});
    if (pending) {
      var cur = display[pending.code] ? shallowClone(display[pending.code]) : { name: pending.name };
      if (!cur[pending.slot]) cur[pending.slot] = pending.time;
      if (!cur.name) cur.name = pending.name;
      display[pending.code] = cur;
    }
    return display;
  }

  window.fetchLogsJSONP = function(onDone, silent){
    var todayStr = getTodayString();
    document.getElementById("todayLabel").textContent = todayStr;
    var tbody = document.querySelector("#todayTable tbody");
    if (!silent) tbody.innerHTML = '<tr><td colspan="5" class="muted">Loading records...</td></tr>';

    var btn = document.getElementById("btn-refresh");
    if (!silent) btn.classList.add("loading");

    var callbackName = "jsonp_" + Math.round(100000 * Math.random());
    var script = document.createElement("script");
    var done = false;

    function finish(errMsg, rawData){
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (errMsg && !silent) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted" style="color:#a92424; font-weight:600;">Error: ' + errMsg + '</td></tr>';
      }
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[callbackName];
      if (!silent) btn.classList.remove("loading");
      if (typeof onDone === "function") onDone(rawData);
    }

    window[callbackName] = function(data){
      if (data && data.success) {
        var raw = data.data || {};
        cachedLogs = applyPendingOverlay(raw);
        renderToday();
        refreshButtons();
        finish(null, raw);
      } else {
        finish((data && data.error) || "Backend returned an error");
      }
    };

    script.onerror = function(){
      finish("Could not load backend. Verify the /exec URL and that the Web App is deployed as 'Anyone, even anonymous'.");
    };
    var timer = setTimeout(function(){
      finish("Backend did not respond within 12s.");
    }, 12000);

    script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(todayStr) + "&callback=" + callbackName;
    document.body.appendChild(script);
  };

  document.getElementById("hidden_post_iframe").onload = function(){
    if (!pending) return;

    var saved = pending;
    var attemptsLeft = 2;

    function verify(){
      window.fetchLogsJSONP(function(rawData){
        var raw = rawData || {};
        var rec = raw[saved.code] || {};
        if (rec[saved.slot] === saved.time) {
          showMsg("ok", "✅ " + saved.name + " — " + SLOT_LABELS[saved.slot] + " at " + saved.time);
          pending = null;
          if (saved.slot === "pm_in") document.getElementById("halfDay").checked = false;
          refreshButtons();
          return;
        }
        attemptsLeft--;
        if (attemptsLeft > 0) {
          setTimeout(verify, 1500);
        } else {
          pending = null;
          showMsg("err", "⚠ Save was not confirmed by the server. Please refresh and try again.");
          window.fetchLogsJSONP();
        }
      }, true);
    }

    setTimeout(verify, 1200);
  };

  function punch(slot){
    if (pending) return showMsg("err", "Please wait — the previous save is being confirmed.");

    var code = sel.value;
    var isHalfDay = document.getElementById("halfDay").checked;
    if (!code) return showMsg("err", "Please select an employee first.");

    var todayStr = getTodayString();
    var currentTimeStr = getCurrentTimeString();
    var rec = cachedLogs[code] || {};

    if (slot === "am_in") {
      if (isHalfDay) return showMsg("err", "AM is blocked for Half-Day.");
      if (rec.am_in) return showMsg("err", "AM Time In already recorded.");
    } else if (slot === "am_out") {
      if (isHalfDay) return showMsg("err", "AM is blocked for Half-Day.");
      if (!rec.am_in) return showMsg("err", "Please log AM Time In first.");
      if (rec.am_out) return showMsg("err", "AM Time Out already recorded.");
    } else if (slot === "pm_in") {
      if (rec.pm_in) return showMsg("err", "PM Time In already recorded.");
      if (!isHalfDay && !rec.am_out) return showMsg("err", "Please log AM Time Out first (or check Half-Day).");
    } else if (slot === "pm_out") {
      if (!rec.pm_in) return showMsg("err", "Please log PM Time In first.");
      if (rec.pm_out) return showMsg("err", "PM Time Out already recorded.");
    }

    var emp = EMPLOYEES.find(function(e){ return e.code === code; });

    var toSave = {
      am_in: rec.am_in || "", am_out: rec.am_out || "",
      pm_in: rec.pm_in || "", pm_out: rec.pm_out || ""
    };
    toSave[slot] = currentTimeStr;

    document.getElementById("f_date").value   = todayStr;
    document.getElementById("f_code").value   = code;
    document.getElementById("f_name").value   = emp.name;
    document.getElementById("f_am_in").value  = toSave.am_in;
    document.getElementById("f_am_out").value = toSave.am_out;
    document.getElementById("f_pm_in").value  = toSave.pm_in;
    document.getElementById("f_pm_out").value = toSave.pm_out;

    pending = { slot: slot, code: code, time: currentTimeStr, name: emp.name };

    var optimistic = shallowClone(rec);
    optimistic[slot] = currentTimeStr;
    if (!optimistic.name) optimistic.name = emp.name;
    cachedLogs[code] = optimistic;

    showMsg("ok", "⏳ Saving " + emp.name + " — " + SLOT_LABELS[slot] + "...");
    renderToday();
    refreshButtons();

    document.getElementById("saveForm").action = API_URL;
    document.getElementById("saveForm").submit();
  }

  function refreshButtons(){
    var code = sel.value;
    var isHalfDay = document.getElementById("halfDay").checked;
    var rec = cachedLogs[code] || {};

    document.getElementById("btn-am-in").disabled  = isHalfDay || !!rec.am_in;
    document.getElementById("btn-am-out").disabled = isHalfDay || !rec.am_in || !!rec.am_out;
    document.getElementById("btn-pm-in").disabled  = !!rec.pm_in || (!isHalfDay && !rec.am_out);
    document.getElementById("btn-pm-out").disabled = !rec.pm_in || !!rec.pm_out;
  }

  function renderToday(){
    var tbody = document.querySelector("#todayTable tbody");
    tbody.innerHTML = "";
    var rows = 0;

    EMPLOYEES.forEach(function(e){
      var r = cachedLogs[e.code];
      if (!r) return;
      if (!r.am_in && !r.am_out && !r.pm_in && !r.pm_out) return;

      var tr = document.createElement("tr");
      tr.innerHTML = '<td>' + e.name + '</td>' +
        '<td>' + (r.am_in || "—") + '</td><td>' + (r.am_out || "—") + '</td>' +
        '<td>' + (r.pm_in || "—") + '</td><td>' + (r.pm_out || "—") + '</td>';
      tbody.appendChild(tr);
      rows++;
    });

    if (!rows) tbody.innerHTML = '<tr><td colspan="5" class="muted">No entries yet today.</td></tr>';
  }

  document.getElementById("btn-am-in").addEventListener("click",  function(){ punch("am_in");  });
  document.getElementById("btn-am-out").addEventListener("click", function(){ punch("am_out"); });
  document.getElementById("btn-pm-in").addEventListener("click",  function(){ punch("pm_in");  });
  document.getElementById("btn-pm-out").addEventListener("click", function(){ punch("pm_out"); });

  sel.addEventListener("change", function(){
    refreshButtons();
    document.getElementById("status").className = "";
  });
  document.getElementById("halfDay").addEventListener("change", refreshButtons);

  window.fetchLogsJSONP();
});
</script>
</body>
</html>
