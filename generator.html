<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyyaX_v0Nbvxm-QUyRSDEtY3d6CNRHu63fPqTSoz5ly0ixwZR5IX4hWbTD3hb3iHsSR/exec";
var LEGACY_KEY = "dhsud_skeletal_workforce";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Gallego" }
];

/* ── ISO week helpers ──────────────────────────────────── */
function getIsoWeekKey(date) {
  var d = new Date(date.getTime());
  d.setHours(0,0,0,0);
  var dow = (d.getDay() + 6) % 7 + 1;
  d.setDate(d.getDate() + 4 - dow);
  var yearStart = new Date(d.getFullYear(), 0, 1);
  var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getFullYear() + "-W" + String(weekNo).padStart(2, '0');
}

/* ── Fetch skeletal data from backend ──────────────────── */
function fetchSkeletal() {
  return new Promise(function(resolve) {
    var cbName = "jsonp_skelgen_" + Math.random().toString(36).slice(2);
    var script = document.createElement("script");
    var done = false;
    function finish(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[cbName];
      resolve(r || {});
    }
    window[cbName] = function(data) {
      if (data && data.success && data.data) finish(data.data);
      else finish({});
    };
    script.onerror = function() { finish({}); };
    var timer = setTimeout(function() { finish({}); }, 12000);
    script.src = API_URL + "?action=getSkeletal&callback=" + cbName;
    document.body.appendChild(script);
  });
}

/* ── Local legacy fallback (only used if backend is completely empty) ── */
function loadSkeletalLegacy() {
  try {
    var arr = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");
    var set = {};
    if (Array.isArray(arr)) arr.forEach(function(c){ set[c] = true; });
    return set;
  } catch(e) { return {}; }
}

/* ── Time helpers ──────────────────────────────────────── */
function isFriday(y, m, d) { return new Date(y, m, d).getDay() === 5; }

function parseMins(t) {
  if (!t) return null;
  var match = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!match) return null;
  var h = parseInt(match[1], 10), m = parseInt(match[2], 10), ap = match[3].toUpperCase();
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h * 60 + m;
}

function calculateWorkedMinutes(amIn, amOut, pmIn, pmOut) {
  var inM = parseMins(amIn), outM = parseMins(amOut);
  var pmInM = parseMins(pmIn), pmOutM = parseMins(pmOut);
  var total = 0;
  if (inM === null && pmInM !== null && pmOutM !== null) return Math.max(0, pmOutM - pmInM);
  if (inM === null) return 0;
  if (outM !== null && outM <= 749 && (pmInM === null || pmOutM === null)) {
    return Math.max(0, outM - inM);
  }
  if (outM !== null && outM >= 750 && outM <= 779) {
    total += Math.max(0, 720 - inM);
    if (pmOutM !== null) total += Math.max(0, pmOutM - outM);
    return total;
  }
  if (outM !== null) total += Math.max(0, Math.min(720, outM) - inM);
  if (pmInM !== null && pmOutM !== null) total += Math.max(0, pmOutM - Math.max(780, pmInM));
  return total;
}

/* ── Main ──────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", function () {
  var sel = document.getElementById("dtrEmp");
  EMPLOYEES.forEach(function(e){
    var o = document.createElement("option");
    o.value = e.code; o.textContent = e.code + " — " + e.name;
    sel.appendChild(o);
  });

  document.getElementById("btn-print").addEventListener("click", function(){
    var code   = sel.value;
    var startV = document.getElementById("startDate").value;
    var endV   = document.getElementById("endDate").value;
    var msg    = document.getElementById("dtrStatus");

    if (!code || !startV || !endV) {
      msg.textContent = "⚠ Please fill all fields.";
      msg.style.color = "#9b1c1c";
      return;
    }
    if (new Date(endV) < new Date(startV)) {
      msg.textContent = "⚠ End date must be after start date.";
      msg.style.color = "#9b1c1c";
      return;
    }

    var start = new Date(startV + "T00:00:00");
    var end   = new Date(endV   + "T00:00:00");

    if (start.getFullYear() !== end.getFullYear() || start.getMonth() !== end.getMonth()) {
      msg.innerHTML = "⚠ <b>Period must be within a single calendar month.</b><br>CSC Form No. 48 is a per‑month form — print one DTR per month.";
      msg.style.color = "#9b1c1c";
      return;
    }

    msg.textContent = "⏳ Fetching skeletal data from Google Sheets…";
    msg.style.color = "#1f4e79";

    buildDTR(code, start, end);
  });

  function fetchDateDataJSONP(dateStr) {
    return new Promise(function(resolve) {
      var cbName = "jsonp_dtr_" + Math.round(1000000 * Math.random());
      var script = document.createElement("script");
      var done = false;
      function finish(r) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[cbName];
        resolve(r);
      }
      window[cbName] = function(data) { finish(data || { success: false, data: {} }); };
      script.onerror = function() { finish({ success: false, error: "Network error" }); };
      var timer = setTimeout(function() { finish({ success: false, error: "Timeout" }); }, 12000);
      script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(dateStr) + "&callback=" + cbName;
      document.body.appendChild(script);
    });
  }

  async function buildDTR(code, start, end) {
    var emp = EMPLOYEES.find(function(e){ return e.code === code; });

    /* Fetch skeletal data from backend — this is the source of truth */
    var skeletalByWeek = await fetchSkeletal();
    var legacySet      = loadSkeletalLegacy();

    /* Backend is considered "migrated" if ANY week is configured.
       Only when it's completely empty do we fall back to legacy localStorage. */
    var backendHasData = Object.keys(skeletalByWeek).length > 0;

    function isSkeletalOn(empCode, date) {
      if (backendHasData) {
        var wk = getIsoWeekKey(date);
        if (Object.prototype.hasOwnProperty.call(skeletalByWeek, wk)) {
          return (skeletalByWeek[wk] || []).indexOf(empCode) !== -1;
        }
        return false;   // week not configured in backend → treat as not skeletal
      }
      /* Backend empty → use local legacy as one-time fallback */
      return !!legacySet[empCode];
    }

    var totalUT = 0;
    var rowsHTML = "";
    var byDay = {};
    var failedDates = [];
    var year = start.getFullYear();
    var month = start.getMonth();
    var startDay = start.getDate();
    var endDay = end.getDate();

    document.getElementById("dtrStatus").textContent = "⏳ Downloading time logs…";

    for (var d = startDay; d <= endDay; d++) {
      var cellDate = new Date(year, month, d);
      var dStr = year + "-" + String(month + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');

      if (isFriday(year, month, d) && !isSkeletalOn(code, cellDate)) {
        byDay[d] = { success: true, data: {} };
        continue;
      }

      var data = await fetchDateDataJSONP(dStr);
      if (!data || !data.success) {
        failedDates.push(dStr);
        byDay[d] = { success: false, data: {} };
      } else {
        byDay[d] = data;
      }
    }

    if (failedDates.length) {
      var m = document.getElementById("dtrStatus");
      m.style.color = "#9b1c1c";
      m.textContent = "⚠ " + failedDates.length + " date(s) failed to load. Generating with partial data.";
    }

    for (var j = 1; j <= 31; j++) {
      var amIn = "", amOut = "", pmIn = "", pmOut = "", utH = "", utM = "";
      var rec = byDay[j];
      if (rec && rec.success && rec.data && rec.data[code]) {
        var dd = rec.data[code];
        amIn  = dd.am_in  || "";
        amOut = dd.am_out || "";
        pmIn  = dd.pm_in  || "";
        pmOut = dd.pm_out || "";
        var worked = calculateWorkedMinutes(amIn, amOut, pmIn, pmOut);
        var ut = Math.max(0, 480 - worked);
        totalUT += ut;
        utH = Math.floor(ut / 60);
        utM = ut % 60;
      }
      rowsHTML += `<tr><td>${j}</td><td>${amIn}</td><td>${amOut}</td><td>${pmIn}</td><td>${pmOut}</td><td>${utH}</td><td>${utM}</td></tr>`;
    }

    /* Determine final employee type — skeletal if ANY Friday in the
       period is on a skeletal list (backend or, if empty, legacy). */
    var empIsSkeletal = false;
    for (var fd = startDay; fd <= endDay; fd++) {
      if (isFriday(year, month, fd) && isSkeletalOn(code, new Date(year, month, fd))) {
        empIsSkeletal = true;
        break;
      }
    }

    /* Diagnostic — always visible in DevTools Console */
    var fridaysInPeriod = [];
    for (var q = startDay; q <= endDay; q++) {
      if (isFriday(year, month, q)) {
        var ddObj = new Date(year, month, q);
        fridaysInPeriod.push({
          date: (q) + "/" + (month + 1),
          week: getIsoWeekKey(ddObj),
          configured: backendHasData ? Object.prototype.hasOwnProperty.call(skeletalByWeek, getIsoWeekKey(ddObj)) : "(backend empty)",
          skeletalHere: isSkeletalOn(code, ddObj)
        });
      }
    }
    console.log("═══ DTR BUILD ═══");
    console.log("Employee:", code, emp.name);
    console.log("Period:", startDay + "–" + endDay + " of " + (month + 1) + "/" + year);
    console.log("backendHasData:", backendHasData, "| legacyKeys:", Object.keys(legacySet).length);
    console.log("Fridays in period:", fridaysInPeriod);
    console.log("Classification:", empIsSkeletal ? "SKELETAL (no DO No.)" : "REGULAR (DO No. 2026-015)");

    generatePrint(emp, rowsHTML, totalUT, empIsSkeletal);
  }

  function generatePrint(emp, rowsHTML, totalUT, empIsSkeletal) {
    var period = document.getElementById("period").value.trim();
    var totalUTH = Math.floor(totalUT / 60);
    var totalUTM = totalUT % 60;

    /* Type label — printed on the DTR for clarity */
    var typeLabel = empIsSkeletal ? "Skeletal Workforce" : "Regular (Non-Skeletal)";

    var officialHoursTxt = empIsSkeletal
      ? "Mon–Thu 7:00 A.M. – 4:00 P.M. · Fri 8:00 A.M. – 5:00 P.M."
      : "Mon–Thu 7:00 A.M. – 6:00 P.M. (Compressed, no work Fridays)";

    var arrivalTxt = empIsSkeletal
      ? "Arrival: 7 A.M. (Mon–Thu) / 8 A.M. (Fri)"
      : "Arrival: 7 A.M. (Mon–Thu only)";
    var departureTxt = empIsSkeletal
      ? "Departure: 4 P.M. (Mon–Thu) / 5 P.M. (Fri)"
      : "Departure: 6 P.M. (Mon–Thu only)";

    /* DO No. 2026-015 gets its OWN visible line for non-skeletal employees */
    var doRefLine = empIsSkeletal
      ? ""
      : `<div class="info-row" style="margin-top:1px;">
           <div class="info-col" style="text-align:left;">
             <b>Reference:</b> <span style="text-decoration:underline; font-weight:bold;">DO No. 2026-015</span>
           </div>
         </div>`;

    var singleCopyHTML = `
      <div class="dtr-copy">
        <div>
          <div class="dtr-header">
            <h3>Republic of the Philippines</h3>
            <h2>DEPARTMENT OF HUMAN SETTLEMENTS AND URBAN DEVELOPMENT</h2>
            <h4>Negros Island Region</h4>
            <h4>(Robinsons Supermarket Villamonte) 2/F East 3 Center,</h4>
            <h4>Narra Extension, Burgos Avenue, Brgy. Villamonte, Bacolod City</h4>
          </div>
          <div class="form-title">CSC Form No. 48</div>
          <div class="form-title" style="text-align:center; font-weight:bold;">DAILY TIME RECORD</div>
          <div class="info-row" style="margin-top:5px;">
            <div class="info-col" style="text-align:left;"><b>Name:</b> <span style="text-decoration:underline;">${emp.name}</span></div>
          </div>
          <div class="info-row">
            <div class="info-col" style="text-align:left;"><b>For the period:</b> <span style="text-decoration:underline;">${period}</span></div>
          </div>
          <div class="info-row">
            <div class="info-col" style="text-align:left;"><b>Employee Type:</b> <span style="text-decoration:underline;">${typeLabel}</span></div>
          </div>
          <div class="info-row">
            <div class="info-col" style="text-align:left;"><b>Official Hours:</b> <span style="text-decoration:underline;">${officialHoursTxt}</span></div>
          </div>
          ${doRefLine}
          <div class="info-row" style="margin-bottom: 5px;">
            <div class="info-col" style="text-align:left;"><b>${arrivalTxt}</b></div>
            <div class="info-col" style="text-align:right;"><b>${departureTxt}</b></div>
          </div>
          <table class="dtr-table">
            <thead>
              <tr><th rowspan="2" class="day-col">Day</th><th colspan="2">A.M.</th><th colspan="2">P.M.</th><th colspan="2">Undertime</th></tr>
              <tr><th class="time-col">Arrival</th><th class="time-col">Departure</th><th class="time-col">Arrival</th><th class="time-col">Departure</th><th class="ut-col">Hours</th><th class="ut-col">Mins.</th></tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
            <tfoot>
              <tr><td colspan="5" style="text-align:right; font-weight:bold; padding-right:5px;">TOTAL UNDERTIME</td><td style="font-weight:bold;">${totalUTH}</td><td style="font-weight:bold;">${totalUTM}</td></tr>
              <tr><td colspan="7" style="text-align:left; font-size:7px; padding:3px;"><b>Leave:</b> &nbsp; VL - _____ &nbsp; SL - _____ &nbsp; SpL - _____ &nbsp; UT - _____</td></tr>
            </tfoot>
          </table>
        </div>
        <div class="dtr-footer">
          <div class="certify-text">I certify on my honor that the above is correct of the hours of work performed. Record of which was made daily at the time of arrival and departure from the office.</div>
          <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <div class="signature-block"><div class="signature-name">${emp.name}</div><div class="signature-title">Employee Signature</div></div>
            <div class="signature-block"><div class="signature-name">ELENITA PAULINA R. CAÑETE</div><div class="signature-title">OIC-REGIONAL DIRECTOR</div></div>
          </div>
        </div>
      </div>
    `;

    document.getElementById("print-area").innerHTML = singleCopyHTML + singleCopyHTML;
    document.getElementById("dtrStatus").textContent = "✅ Generating Print Preview...";
    document.getElementById("dtrStatus").style.color = "#1c8a4b";

    setTimeout(function() { window.print(); }, 200);
  }
});
</script>
