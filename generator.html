<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>DHSUD NIR — DTR Print Generator</title>
<style>
  :root {
    --blue-700:#1f4e79; --blue-600:#2a6299; --blue-500:#4a90d9;
    --blue-100:#e8f1fb; --blue-50:#f4f8fd;
    --ink-900:#0e1825; --ink-700:#2c3a4c; --ink-500:#5a6b80;
    --line:#dbe3ee; --bg:#eef2f8; --white:#fff;
    --shadow-md:0 4px 12px rgba(15,42,71,.08),0 1px 3px rgba(15,42,71,.05);
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body {
    margin:0; color:var(--ink-900); min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -220px,#dbe8f7 0%,transparent 70%),var(--bg);
  }
  header {
    background:linear-gradient(135deg,var(--blue-700) 0%,var(--blue-600) 100%);
    color:#fff; padding:14px 26px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 12px rgba(15,42,71,.18); position:sticky; top:0; z-index:20;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#fff 0%,#e8f1fb 100%);
    color:var(--blue-700); font-weight:800; font-size:15px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -2px 0 rgba(15,42,71,.12);
  }
  .brand-text { display:flex; flex-direction:column; line-height:1.1; }
  .brand-title { font-size:15px; font-weight:800; letter-spacing:.4px; }
  .brand-sub   { font-size:11px; font-weight:600; color:rgba(255,255,255,.72); letter-spacing:.6px; text-transform:uppercase; }
  .nav-links { display:flex; gap:8px; }
  .nav-links a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    padding:8px 14px; border-radius:999px;
  }
  .nav-links a:hover { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.34); }

  .wrap { max-width:760px; margin:26px auto 40px; padding:0 18px; }
  .card {
    background:var(--white); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow-md); border:1px solid rgba(219,227,238,.7);
    margin-bottom:22px;
  }
  h2 { margin:0 0 20px; font-size:17px; color:var(--blue-700); letter-spacing:-.2px; }

  label { display:block; font-size:12px; font-weight:800; margin:0 0 6px; color:var(--ink-700); letter-spacing:.03em; text-transform:uppercase; }
  select, input[type="text"], input[type="date"] {
    width:100%; padding:12px 14px; border:1.5px solid #ccd9e8; border-radius:var(--radius-sm);
    font-size:15px; font-weight:600; color:var(--ink-900); background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select {
    appearance:none; padding-right:44px; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%231f4e79' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 16px center; background-size:18px;
  }
  select:hover, input:hover { border-color:#b8cbe3; }
  select:focus, input:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(74,144,217,.18); }

  .field { margin-bottom:16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }

  .primary {
    background:linear-gradient(135deg,var(--blue-600) 0%,var(--blue-500) 100%);
    color:#fff; width:100%; margin-top:8px; border:0; padding:16px;
    font-size:16px; font-weight:800; border-radius:var(--radius-sm); cursor:pointer;
    box-shadow:0 6px 16px rgba(42,98,153,.30);
    transition:filter .15s ease, transform .08s ease, box-shadow .15s ease;
  }
  .primary:hover { filter:brightness(1.06); box-shadow:0 8px 20px rgba(42,98,153,.36); }
  .primary:active { transform:translateY(1px); }

  #dtrStatus {
    margin-top:16px; font-size:13px; font-weight:600; text-align:center;
    padding:12px 16px; border-radius:var(--radius-sm);
    background:var(--blue-50); color:var(--ink-500);
    border:1px solid #dbe8f5; line-height:1.5;
  }

  #fatal { display:none; background:#fde7e7; color:#9b1c1c; padding:12px; border-radius:10px; margin-bottom:14px; white-space:pre-wrap; font-family:monospace; border:1px solid #f3bcbc; font-size:13px; }

  #print-area { display: none; }

  @media (max-width:560px) {
    .row { grid-template-columns:1fr; }
    .brand-sub { display:none; }
    .card { padding:18px; }
    header { padding:12px 16px; }
    .nav-links a { padding:7px 12px; font-size:12px; }
  }

  /* ═════════ PRINT LAYOUT ═════════ */
  @media print {
    @page { size: 13in 8.5in landscape; margin: 0.3in; }
    body { background:#fff; margin:0; padding:0; }
    header, .wrap, #fatal { display:none !important; }

    #print-area {
      display:flex;
      flex-direction:row;
      justify-content:space-between;
      align-items:stretch;
      width:100%;
      gap:10px;
      font-family:Arial, sans-serif;
      color:#000;
    }

    .dtr-copy {
      flex:1;
      font-size:8px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .dtr-header { text-align:center; margin-bottom:5px; line-height:1.1; }
    .dtr-header h3 { margin:0; font-size:9px; font-weight:normal; }
    .dtr-header h2 { margin:0; font-size:10px; font-weight:bold; }
    .dtr-header h4 { margin:0; font-size:9px; font-weight:normal; }

    .form-title { font-size:9px; margin-bottom:2px; }
    .info-row { display:flex; margin-bottom:2px; font-size:8px; }
    .info-col { flex:1; }

    .dtr-table { width:100%; border-collapse:collapse; margin-top:5px; }
    .dtr-table th, .dtr-table td { border:1px solid #000; text-align:center; padding:1px 2px; font-size:8px; }
    .dtr-table th { font-weight:bold; }
    .dtr-table .day-col { width:5%; }
    .dtr-table .time-col { width:14%; }
    .dtr-table .ut-col { width:9%; }

    .dtr-footer { margin-top:10px; font-size:8px; }
    .certify-text { margin-bottom:15px; text-align:justify; line-height:1.2; }
    .signature-block { text-align:center; width:45%; }
    .signature-name { font-weight:bold; text-decoration:underline; margin-bottom:2px; font-size:8px; }
    .signature-title { border-top:1px solid #000; padding-top:2px; font-size:8px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">DH</div>
    <div class="brand-text">
      <span class="brand-title">DHSUD NIR</span>
      <span class="brand-sub">Print DTR</span>
    </div>
  </div>
  <nav class="nav-links">
    <a href="kiosk.html">🏠 Kiosk</a>
    <a href="skeletal.html">👥 Skeletal</a>
    <a href="index.html">⚙️ Admin</a>
  </nav>
</header>

<div class="wrap">
  <div id="fatal"></div>
  <div class="card">
    <h2>Generate &amp; Print DTR (CSC Form No. 48)</h2>

    <div class="field">
      <label for="dtrEmp">Employee</label>
      <select id="dtrEmp"><option value="">— Select Employee —</option></select>
    </div>

    <div class="field">
      <label for="period">Period Text (appears on form)</label>
      <input type="text" id="period" value="August 1-31, 2026">
    </div>

    <div class="row">
      <div><label for="startDate">Start date</label><input type="date" id="startDate" value="2026-08-01"></div>
      <div><label for="endDate">End date</label><input type="date" id="endDate" value="2026-08-31"></div>
    </div>

    <button type="button" class="primary" id="btn-print">🖨️ Generate &amp; Print DTR</button>

    <div id="dtrStatus">
      ⚠️ <b>Note:</b> In the print dialog, set Layout to <b>Landscape</b> and Paper Size to <b>Long / Legal</b>.<br>
      Friday rows use the <b>skeletal list from that Friday's week</b>. Days outside the chosen period are left blank.
    </div>
  </div>
</div>

<div id="print-area"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyyaX_v0Nbvxm-QUyRSDEtY3d6CNRHu63fPqTSoz5ly0ixwZR5IX4hWbTD3hb3iHsSR/exec";
var LEGACY_KEY = "dhsud_skeletal_workforce";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Gallego" }
];

function getIsoWeekKey(date) {
  var d = new Date(date.getTime());
  d.setHours(0,0,0,0);
  var dow = (d.getDay() + 6) % 7 + 1;
  d.setDate(d.getDate() + 4 - dow);
  var yearStart = new Date(d.getFullYear(), 0, 1);
  var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getFullYear() + "-W" + String(weekNo).padStart(2, '0');
}

function fetchSkeletal() {
  return new Promise(function(resolve) {
    var cbName = "jsonp_skelgen_" + Math.random().toString(36).slice(2);
    var script = document.createElement("script");
    var done = false;
    function finish(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[cbName];
      resolve(r || {});
    }
    window[cbName] = function(data) {
      if (data && data.success && data.data) finish(data.data);
      else finish({});
    };
    script.onerror = function() { finish({}); };
    var timer = setTimeout(function() { finish({}); }, 12000);
    script.src = API_URL + "?action=getSkeletal&callback=" + cbName;
    document.body.appendChild(script);
  });
}

function loadSkeletalLegacy() {
  try {
    var arr = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");
    var set = {};
    if (Array.isArray(arr)) arr.forEach(function(c){ set[c] = true; });
    return set;
  } catch(e) { return {}; }
}

function isFriday(y, m, d) { return new Date(y, m, d).getDay() === 5; }

function parseMins(t) {
  if (!t) return null;
  var match = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!match) return null;
  var h = parseInt(match[1], 10), m = parseInt(match[2], 10), ap = match[3].toUpperCase();
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h * 60 + m;
}

function calculateWorkedMinutes(amIn, amOut, pmIn, pmOut) {
  var inM = parseMins(amIn), outM = parseMins(amOut);
  var pmInM = parseMins(pmIn), pmOutM = parseMins(pmOut);
  var total = 0;
  if (inM === null && pmInM !== null && pmOutM !== null) return Math.max(0, pmOutM - pmInM);
  if (inM === null) return 0;
  if (outM !== null && outM <= 749 && (pmInM === null || pmOutM === null)) {
    return Math.max(0, outM - inM);
  }
  if (outM !== null && outM >= 750 && outM <= 779) {
    total += Math.max(0, 720 - inM);
    if (pmOutM !== null) total += Math.max(0, pmOutM - outM);
    return total;
  }
  if (outM !== null) total += Math.max(0, Math.min(720, outM) - inM);
  if (pmInM !== null && pmOutM !== null) total += Math.max(0, pmOutM - Math.max(780, pmInM));
  return total;
}

document.addEventListener("DOMContentLoaded", function () {
  /* ── Startup guard ─────────────────────────────────── */
  var requiredIds = [
    "dtrEmp", "period", "startDate", "endDate",
    "btn-print", "dtrStatus", "fatal", "print-area"
  ];
  var missing = requiredIds.filter(function(id) {
    return !document.getElementById(id);
  });
  if (missing.length > 0) {
    var fatal = document.getElementById("fatal");
    if (fatal) {
      fatal.style.display = "block";
      fatal.textContent =
        "❌ THIS FILE IS MISSING REQUIRED ELEMENTS:\n\n" +
        missing.map(function(id){ return '  • <... id="' + id + '">'; }).join("\n") +
        "\n\nThe HTML body of generator.html is incomplete. " +
        "Check that you pasted the FULL file, not just the <script> block.";
    }
    console.error("❌ Missing elements:", missing);
    console.error("All IDs currently in the page:",
      Array.from(document.querySelectorAll("[id]")).map(function(e){ return e.id; }));
    return;
  }

  /* ── Populate employee dropdown ───────────────────── */
  var sel = document.getElementById("dtrEmp");
  EMPLOYEES.forEach(function(e){
    var o = document.createElement("option");
    o.value = e.code;
    o.textContent = e.code + " — " + e.name;
    sel.appendChild(o);
  });

  document.getElementById("btn-print").addEventListener("click", function(){
    var code   = sel.value;
    var startV = document.getElementById("startDate").value;
    var endV   = document.getElementById("endDate").value;
    var msg    = document.getElementById("dtrStatus");

    if (!code || !startV || !endV) {
      msg.textContent = "⚠ Please fill all fields.";
      msg.style.color = "#9b1c1c";
      return;
    }
    if (new Date(endV) < new Date(startV)) {
      msg.textContent = "⚠ End date must be after start date.";
      msg.style.color = "#9b1c1c";
      return;
    }

    var start = new Date(startV + "T00:00:00");
    var end   = new Date(endV   + "T00:00:00");

    if (start.getFullYear() !== end.getFullYear() || start.getMonth() !== end.getMonth()) {
      msg.innerHTML = "⚠ <b>Period must be within a single calendar month.</b><br>CSC Form No. 48 is a per-month form — print one DTR per month.";
      msg.style.color = "#9b1c1c";
      return;
    }

    msg.textContent = "⏳ Fetching skeletal data from Google Sheets…";
    msg.style.color = "#1f4e79";

    buildDTR(code, start, end);
  });

  function fetchDateDataJSONP(dateStr) {
    return new Promise(function(resolve) {
      var cbName = "jsonp_dtr_" + Math.round(1000000 * Math.random());
      var script = document.createElement("script");
      var done = false;
      function finish(r) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[cbName];
        resolve(r);
      }
      window[cbName] = function(data) { finish(data || { success: false, data: {} }); };
      script.onerror = function() { finish({ success: false, error: "Network error" }); };
      var timer = setTimeout(function() { finish({ success: false, error: "Timeout" }); }, 12000);
      script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(dateStr) + "&callback=" + cbName;
      document.body.appendChild(script);
    });
  }

  async function buildDTR(code, start, end) {
    var emp = EMPLOYEES.find(function(e){ return e.code === code; });
    if (!emp) {
      document.getElementById("dtrStatus").textContent = "⚠ Employee code " + code + " not found.";
      document.getElementById("dtrStatus").style.color = "#9b1c1c";
      return;
    }

    var skeletalByWeek = await fetchSkeletal();
    var legacySet      = loadSkeletalLegacy();
    var backendHasData = Object.keys(skeletalByWeek).length > 0;

    function isSkeletalOn(empCode, date) {
      if (backendHasData) {
        var wk = getIsoWeekKey(date);
        if (Object.prototype.hasOwnProperty.call(skeletalByWeek, wk)) {
          return (skeletalByWeek[wk] || []).indexOf(empCode) !== -1;
        }
        return false;
      }
      return !!legacySet[empCode];
    }

    var totalUT = 0;
    var rowsHTML = "";
    var byDay = {};
    var failedDates = [];
    var year = start.getFullYear();
    var month = start.getMonth();
    var startDay = start.getDate();
    var endDay = end.getDate();

    document.getElementById("dtrStatus").textContent = "⏳ Downloading time logs…";

    for (var d = startDay; d <= endDay; d++) {
      var cellDate = new Date(year, month, d);
      var dStr = year + "-" + String(month + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');

      if (isFriday(year, month, d) && !isSkeletalOn(code, cellDate)) {
        byDay[d] = { success: true, data: {} };
        continue;
      }

      var data = await fetchDateDataJSONP(dStr);
      if (!data || !data.success) {
        failedDates.push(dStr);
        byDay[d] = { success: false, data: {} };
      } else {
        byDay[d] = data;
      }
    }

    if (failedDates.length) {
      var m = document.getElementById("dtrStatus");
      m.style.color = "#9b1c1c";
      m.textContent = "⚠ " + failedDates.length + " date(s) failed to load. Generating with partial data.";
    }

    for (var j = 1; j <= 31; j++) {
      var amIn = "", amOut = "", pmIn = "", pmOut = "", utH = "", utM = "";
      var rec = byDay[j];
      if (rec && rec.success && rec.data && rec.data[code]) {
        var dd = rec.data[code];
        amIn  = dd.am_in  || "";
        amOut = dd.am_out || "";
        pmIn  = dd.pm_in  || "";
        pmOut = dd.pm_out || "";
        var worked = calculateWorkedMinutes(amIn, amOut, pmIn, pmOut);
        var ut = Math.max(0, 480 - worked);
        totalUT += ut;
        utH = Math.floor(ut / 60);
        utM = ut % 60;
      }
      rowsHTML += '<tr><td>' + j + '</td><td>' + amIn + '</td><td>' + amOut +
                  '</td><td>' + pmIn + '</td><td>' + pmOut +
                  '</td><td>' + utH + '</td><td>' + utM + '</td></tr>';
    }

    var empIsSkeletal = false;
    for (var fd = startDay; fd <= endDay; fd++) {
      if (isFriday(year, month, fd) && isSkeletalOn(code, new Date(year, month, fd))) {
        empIsSkeletal = true;
        break;
      }
    }

    /* Console diagnostic */
    var fridaysInPeriod = [];
    for (var q = startDay; q <= endDay; q++) {
      if (isFriday(year, month, q)) {
        var ddObj = new Date(year, month, q);
        var wkKey = getIsoWeekKey(ddObj);
        fridaysInPeriod.push({
          date: q + "/" + (month + 1),
          week: wkKey,
          configured: backendHasData ? Object.prototype.hasOwnProperty.call(skeletalByWeek, wkKey) : "(backend empty)",
          skeletalHere: isSkeletalOn(code, ddObj)
        });
      }
    }
    console.log("═══ DTR BUILD ═══");
    console.log("Employee:", code, emp.name);
    console.log("Period:", startDay + "–" + endDay + " of " + (month + 1) + "/" + year);
    console.log("backendHasData:", backendHasData, "| legacyKeys:", Object.keys(legacySet).length);
    console.log("Fridays in period:", fridaysInPeriod);
    console.log("Classification:", empIsSkeletal ? "SKELETAL (no DO No.)" : "REGULAR (DO No. 2026-015)");

    generatePrint(emp, rowsHTML, totalUT, empIsSkeletal);
  }

  function generatePrint(emp, rowsHTML, totalUT, empIsSkeletal) {
    var period = document.getElementById("period").value.trim();
    var totalUTH = Math.floor(totalUT / 60);
    var totalUTM = totalUT % 60;

    var typeLabel = empIsSkeletal ? "Skeletal Workforce" : "Regular (Non-Skeletal)";

    /* DO No. is included in Official Hours for regular employees,
       AND also on a dedicated bordered Reference line — belt and suspenders. */
    var officialHoursTxt = empIsSkeletal
      ? "Mon–Thu 7:00 A.M. – 4:00 P.M. · Fri 8:00 A.M. – 5:00 P.M."
      : "Mon–Thu 7:00 A.M. – 6:00 P.M. (Compressed, no work Fridays) / DO No. 2026-015";

    var arrivalTxt = empIsSkeletal
      ? "Arrival: 7 A.M. (Mon–Thu) / 8 A.M. (Fri)"
      : "Arrival: 7 A.M. (Mon–Thu only)";

    var departureTxt = empIsSkeletal
      ? "Departure: 4 P.M. (Mon–Thu) / 5 P.M. (Fri)"
      : "Departure: 6 P.M. (Mon–Thu only)";

    var doRefLine = empIsSkeletal
      ? ""
      : '<div class="info-row" style="margin-top:3px; margin-bottom:3px; padding:3px 6px; border:1px solid #000; background:#eef4fb;">' +
          '<div class="info-col" style="text-align:left; font-size:9px;">' +
            '<b>Reference:</b> <b>DO No. 2026-015</b> — Compressed Workweek, no work on Fridays' +
          '</div>' +
        '</div>';

    /* Diagnostic log at print time */
    console.log("── generatePrint ──");
    console.log("  Employee Type      :", typeLabel);
    console.log("  DO No. shown?      :", empIsSkeletal ? "NO (employee is skeletal)" : "YES");
    console.log("  Official Hours txt :", officialHoursTxt);
    console.log("  DO ref line length :", doRefLine.length, doRefLine.length === 0 ? "(hidden — skeletal)" : "(visible — regular)");

    var singleCopyHTML =
      '<div class="dtr-copy">' +
        '<div>' +
          '<div class="dtr-header">' +
            '<h3>Republic of the Philippines</h3>' +
            '<h2>DEPARTMENT OF HUMAN SETTLEMENTS AND URBAN DEVELOPMENT</h2>' +
            '<h4>Negros Island Region</h4>' +
            '<h4>(Robinsons Supermarket Villamonte) 2/F East 3 Center,</h4>' +
            '<h4>Narra Extension, Burgos Avenue, Brgy. Villamonte, Bacolod City</h4>' +
          '</div>' +
          '<div class="form-title">CSC Form No. 48</div>' +
