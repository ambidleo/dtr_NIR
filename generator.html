<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>DHSUD NIR — DTR Print Generator</title>
<style>
  :root {
    --blue-700:#1f4e79; --blue-600:#2a6299; --blue-500:#4a90d9;
    --blue-100:#e8f1fb; --blue-50:#f4f8fd;
    --ink-900:#0e1825; --ink-700:#2c3a4c; --ink-500:#5a6b80;
    --line:#dbe3ee; --bg:#eef2f8; --white:#fff;
    --shadow-md:0 4px 12px rgba(15,42,71,.08),0 1px 3px rgba(15,42,71,.05);
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body {
    margin:0; color:var(--ink-900); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -220px, #dbe8f7 0%, transparent 70%),
      var(--bg);
  }
  header {
    background:linear-gradient(135deg, var(--blue-700) 0%, var(--blue-600) 100%);
    color:#fff; padding:14px 26px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 12px rgba(15,42,71,.18); position:sticky; top:0; z-index:20;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#fff 0%,#e8f1fb 100%);
    color:var(--blue-700); font-weight:800; font-size:15px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -2px 0 rgba(15,42,71,.12);
  }
  .brand-text { display:flex; flex-direction:column; line-height:1.1; }
  .brand-title { font-size:15px; font-weight:800; letter-spacing:.4px; }
  .brand-sub   { font-size:11px; font-weight:600; color:rgba(255,255,255,.72); letter-spacing:.6px; text-transform:uppercase; }
  .nav-links { display:flex; gap:8px; }
  .nav-links a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    padding:8px 14px; border-radius:999px; transition:background .15s ease, border-color .15s ease;
  }
  .nav-links a:hover { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.34); }

  .wrap { max-width:760px; margin:26px auto 40px; padding:0 18px; }
  .card {
    background:var(--white); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow-md); border:1px solid rgba(219,227,238,.7);
    margin-bottom:22px; animation:fadeUp .4s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  h2 { margin:0 0 20px; font-size:17px; color:var(--blue-700); letter-spacing:-.2px; }

  label { display:block; font-size:12px; font-weight:800; margin:0 0 6px; color:var(--ink-700); letter-spacing:.03em; text-transform:uppercase; }
  select, input[type="text"], input[type="date"] {
    width:100%; padding:12px 14px; border:1.5px solid #ccd9e8; border-radius:var(--radius-sm);
    font-size:15px; font-weight:600; color:var(--ink-900); background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select {
    appearance:none; padding-right:44px; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%231f4e79' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 16px center; background-size:18px;
  }
  select:hover, input:hover { border-color:#b8cbe3; }
  select:focus, input:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(74,144,217,.18); }

  .field { margin-bottom:16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }

  .primary {
    background:linear-gradient(135deg, var(--blue-600) 0%, var(--blue-500) 100%);
    color:#fff; width:100%; margin-top:8px; border:0; padding:16px;
    font-size:16px; font-weight:800; border-radius:var(--radius-sm); cursor:pointer;
    box-shadow:0 6px 16px rgba(42,98,153,.30);
    transition:filter .15s ease, transform .08s ease, box-shadow .15s ease;
  }
  .primary:hover { filter:brightness(1.06); box-shadow:0 8px 20px rgba(42,98,153,.36); }
  .primary:active { transform:translateY(1px); }

  #dtrStatus {
    margin-top:16px; font-size:13px; font-weight:600; text-align:center;
    padding:12px 16px; border-radius:var(--radius-sm);
    background:var(--blue-50); color:var(--ink-500);
    border:1px solid #dbe8f5; line-height:1.5;
  }

  #fatal { display:none; background:#fde7e7; color:#9b1c1c; padding:12px; border-radius:10px; margin-bottom:14px; white-space:pre-wrap; font-family:monospace; border:1px solid #f3bcbc; }

  #print-area { display: none; }

  @media (max-width:560px) {
    .row { grid-template-columns:1fr; }
    .brand-sub { display:none; }
    .card { padding:18px; }
    header { padding:12px 16px; }
    .nav-links a { padding:7px 12px; font-size:12px; }
  }

  @media print {
    @page { size: 13in 8.5in landscape; margin: 0.3in; }
    body { background: #fff; margin: 0; padding: 0; }
    header, .wrap, #fatal { display: none !important; }

    #print-area {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;
      gap: 10px;
      font-family: Arial, sans-serif;
      color: #000;
    }

    .dtr-copy {
      flex: 1;
      font-size: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dtr-header { text-align: center; margin-bottom: 5px; line-height: 1.1; }
    .dtr-header h3 { margin: 0; font-size: 9px; font-weight: normal; }
    .dtr-header h2 { margin: 0; font-size: 10px; font-weight: bold; }
    .dtr-header h4 { margin: 0; font-size: 9px; font-weight: normal; }

    .form-title { font-size: 9px; margin-bottom: 2px; }
    .info-row { display: flex; margin-bottom: 2px; font-size: 8px; }
    .info-col { flex: 1; }

    .dtr-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .dtr-table th, .dtr-table td { border: 1px solid #000; text-align: center; padding: 1px 2px; font-size: 8px; }
    .dtr-table th { font-weight: bold; }
    .dtr-table .day-col { width: 5%; }
    .dtr-table .time-col { width: 14%; }
    .dtr-table .ut-col { width: 9%; }

    .dtr-footer { margin-top: 10px; font-size: 8px; }
    .certify-text { margin-bottom: 15px; text-align: justify; line-height: 1.2; }
    .signature-block { text-align: center; width: 45%; }
    .signature-name { font-weight: bold; text-decoration: underline; margin-bottom: 2px; font-size: 8px; }
    .signature-title { border-top: 1px solid #000; padding-top: 2px; font-size: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">DH</div>
    <div class="brand-text">
      <span class="brand-title">DHSUD NIR</span>
      <span class="brand-sub">Print DTR</span>
    </div>
  </div>
  <nav class="nav-links">
    <a href="kiosk.html">🏠 Kiosk</a>
    <a href="index.html">⚙️ Admin</a>
  </nav>
</header>

<div class="wrap">
  <div id="fatal"></div>
  <div class="card">
    <h2>Generate & Print DTR (CSC Form No. 48)</h2>

    <div class="field">
      <label for="dtrEmp">Employee</label>
      <select id="dtrEmp"><option value="">— Select Employee —</option></select>
    </div>

    <div class="field">
      <label for="period">Period Text (appears on form)</label>
      <input type="text" id="period" value="August 16-31, 2026">
    </div>

    <div class="row">
      <div><label for="startDate">Start date</label><input type="date" id="startDate" value="2026-08-16"></div>
      <div><label for="endDate">End date</label><input type="date" id="endDate" value="2026-08-31"></div>
    </div>

    <button type="button" class="primary" id="btn-print">🖨️ Generate & Print DTR</button>

    <div id="dtrStatus">
      ⚠️ <b>Note:</b> In the print dialog, set Layout to <b>Landscape</b> and Paper Size to <b>Long / Legal</b>.
      The Day column always shows the day of the month (1–31); days outside the chosen period are left blank.
    </div>
  </div>
</div>

<div id="print-area"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyb-FV2-lV_DKEVDmXJ6JmII-hxfQza-ewMRA7ICihi7wY3P0Ppvd4DjKwwu3NGzu8I/exec";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Gallego" }
];

function parseMins(t) {
  if (!t) return null;
  var match = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!match) return null;
  var h = parseInt(match[1], 10), m = parseInt(match[2], 10), ap = match[3].toUpperCase();
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h * 60 + m;
}

function calculateWorkedMinutes(amIn, amOut, pmIn, pmOut) {
  var inM = parseMins(amIn), outM = parseMins(amOut), pmInM = parseMins(pmIn), pmOutM = parseMins(pmOut);
  var total = 0;
  if (inM === null && pmInM !== null && pmOutM !== null) return Math.max(0, pmOutM - pmInM);
  if (inM === null) return 0;
  if (outM !== null && outM <= 749) return Math.max(0, outM - inM);
  if (outM !== null && outM >= 750 && outM <= 779) {
    total += Math.max(0, 720 - inM);
    if (pmOutM !== null) total += Math.max(0, pmOutM - outM);
    return total;
  }
  if (outM !== null) total += Math.max(0, Math.min(720, outM) - inM);
  if (pmInM !== null && pmOutM !== null) total += Math.max(0, pmOutM - Math.max(780, pmInM));
  return total;
}

document.addEventListener("DOMContentLoaded", function () {
  var sel = document.getElementById("dtrEmp");
  EMPLOYEES.forEach(function(e){
    var o = document.createElement("option");
    o.value = e.code; o.textContent = e.code + " — " + e.name;
    sel.appendChild(o);
  });

  document.getElementById("btn-print").addEventListener("click", function(){
    var code   = sel.value;
    var startV = document.getElementById("startDate").value;
    var endV   = document.getElementById("endDate").value;
    var msg    = document.getElementById("dtrStatus");

    if (!code || !startV || !endV) { msg.textContent = "⚠ Please fill all fields."; msg.style.color = "#9b1c1c"; return; }
    if (new Date(endV) < new Date(startV)) { msg.textContent = "⚠ End date must be after start date."; msg.style.color = "#9b1c1c"; return; }

    var start = new Date(startV + "T00:00:00");
    var end   = new Date(endV   + "T00:00:00");

    // CSC Form No. 48 is a per-month form. Guard against multi-month ranges
    // (e.g. Aug 16 – Sep 15) because a single Day 1–31 column can't represent
    // two different months unambiguously.
    if (start.getFullYear() !== end.getFullYear() || start.getMonth() !== end.getMonth()) {
      msg.innerHTML = "⚠ <b>Period must be within a single calendar month.</b> CSC Form No. 48 is a per‑month form.<br>Print one DTR per month.";
      msg.style.color = "#9b1c1c";
      return;
    }

    msg.textContent = "⏳ Downloading data... Please wait.";
    msg.style.color = "#1f4e79";

    buildDTR(code, start, end);
  });

  function fetchDateDataJSONP(dateStr) {
    return new Promise(function(resolve) {
      var callbackName = "jsonp_dtr_" + Math.round(1000000 * Math.random());
      var script = document.createElement("script");
      var done = false;

      function finish(result) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];
        resolve(result);
      }

      window[callbackName] = function(data) {
        finish(data || { success: false, error: "Empty response for " + dateStr });
      };

      script.onerror = function() {
        finish({ success: false, error: "Network error loading " + dateStr });
      };
      var timer = setTimeout(function() {
        finish({ success: false, error: "Timeout loading " + dateStr });
      }, 12000);

      script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(dateStr) + "&callback=" + callbackName;
      document.body.appendChild(script);
    });
  }

  async function buildDTR(code, start, end) {
    var emp = EMPLOYEES.find(function(e){ return e.code === code; });
    var totalUT = 0;
    var rowsHTML = "";
    var byDay = {};               // ← keyed by DAY-OF-MONTH (1..31)
    var failedDates = [];

    var year  = start.getFullYear();
    var month = start.getMonth();           // 0-based
    var startDay = start.getDate();
    var endDay   = end.getDate();

    // Fetch every day in the period, keyed by the day-of-month
    for (var d = startDay; d <= endDay; d++) {
      var dStr = year + "-" +
                 String(month + 1).padStart(2, '0') + "-" +
                 String(d).padStart(2, '0');

      var data = await fetchDateDataJSONP(dStr);
      if (!data || !data.success) {
        failedDates.push(dStr);
        byDay[d] = { success: false, data: {} };
      } else {
        byDay[d] = data;
      }
    }

    if (failedDates.length) {
      var m = document.getElementById("dtrStatus");
      m.style.color = "#9b1c1c";
      m.textContent = "⚠ " + failedDates.length + " date(s) failed to load (" + failedDates.join(", ") + "). Generating with partial data.";
    }

    // Render Day 1..31. Only days inside the chosen period will have data.
    for (var j = 1; j <= 31; j++) {
      var amIn = "", amOut = "", pmIn = "", pmOut = "", utH = "", utM = "";

      var rec = byDay[j];
      if (rec && rec.success && rec.data && rec.data[code]) {
        var dd = rec.data[code];
        amIn  = dd.am_in  || "";
        amOut = dd.am_out || "";
        pmIn  = dd.pm_in  || "";
        pmOut = dd.pm_out || "";

        var worked = calculateWorkedMinutes(amIn, amOut, pmIn, pmOut);
        var ut = Math.max(0, 480 - worked);
        totalUT += ut;
        utH = Math.floor(ut / 60);
        utM = ut % 60;
      }

      rowsHTML += `<tr><td>${j}</td><td>${amIn}</td><td>${amOut}</td><td>${pmIn}</td><td>${pmOut}</td><td>${utH}</td><td>${utM}</td></tr>`;
    }

    // Handy diagnostic while verifying — open DevTools Console to inspect.
    console.log("DTR build — employee:", code, "| month:", month + 1, year,
                "| period:", startDay + "-" + endDay, "| byDay:", byDay);

    generatePrint(emp, rowsHTML, totalUT);
  }

  function generatePrint(emp, rowsHTML, totalUT) {
    var period = document.getElementById("period").value.trim();
    var totalUTH = Math.floor(totalUT / 60);
    var totalUTM = totalUT % 60;

    var singleCopyHTML = `
      <div class="dtr-copy">
        <div>
          <div class="dtr-header">
            <h3>Republic of the Philippines</h3>
            <h2>DEPARTMENT OF HUMAN SETTLEMENTS AND URBAN DEVELOPMENT</h2>
            <h4>Negros Island Region</h4>
            <h4>(Robinsons Supermarket Villamonte) 2/F East 3 Center,</h4>
            <h4>Narra Extension, Burgos Avenue, Brgy. Villamonte, Bacolod City</h4>
          </div>
          <div class="form-title">CSC Form No. 48</div>
          <div class="form-title" style="text-align:center; font-weight:bold;">DAILY TIME RECORD</div>
          <div class="info-row" style="margin-top:5px;">
            <div class="info-col" style="text-align:left;"><b>Name:</b> <span style="text-decoration:underline;">${emp.name}</span></div>
          </div>
          <div class="info-row">
            <div class="info-col" style="text-align:left;"><b>For the period:</b> <span style="text-decoration:underline;">${period}</span></div>
          </div>
          <div class="info-row">
            <div class="info-col" style="text-align:left;"><b>Official Hours:</b> <span style="text-decoration:underline;">Compressed/8:00 A.M. - 5:00 P.M / DO No. 2026-015</span></div>
          </div>
          <div class="info-row" style="margin-bottom: 5px;">
            <div class="info-col" style="text-align:left;"><b>Arrival:</b> 8 A.M. / 1 P.M.</div>
            <div class="info-col" style="text-align:right;"><b>Departure:</b> 12 N / 5 P.M.</div>
          </div>
          <table class="dtr-table">
            <thead>
              <tr><th rowspan="2" class="day-col">Day</th><th colspan="2">A.M.</th><th colspan="2">P.M.</th><th colspan="2">Undertime</th></tr>
              <tr><th class="time-col">Arrival</th><th class="time-col">Departure</th><th class="time-col">Arrival</th><th class="time-col">Departure</th><th class="ut-col">Hours</th><th class="ut-col">Mins.</th></tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
            <tfoot>
              <tr><td colspan="5" style="text-align:right; font-weight:bold; padding-right:5px;">TOTAL UNDERTIME</td><td style="font-weight:bold;">${totalUTH}</td><td style="font-weight:bold;">${totalUTM}</td></tr>
              <tr><td colspan="7" style="text-align:left; font-size:7px; padding:3px;"><b>Leave:</b> &nbsp; VL - _____ &nbsp; SL - _____ &nbsp; SpL - _____ &nbsp; UT - _____</td></tr>
            </tfoot>
          </table>
        </div>
        <div class="dtr-footer">
          <div class="certify-text">I certify on my honor that the above is correct of the hours of work performed. Record of which was made daily at the time of arrival and departure from the office.</div>
          <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <div class="signature-block"><div class="signature-name">${emp.name}</div><div class="signature-title">Employee Signature</div></div>
            <div class="signature-block"><div class="signature-name">ELENITA PAULINA R. CAÑETE</div><div class="signature-title">OIC-REGIONAL DIRECTOR</div></div>
          </div>
        </div>
      </div>
    `;

    document.getElementById("print-area").innerHTML = singleCopyHTML + singleCopyHTML;
    document.getElementById("dtrStatus").textContent = "✅ Generating Print Preview...";
    document.getElementById("dtrStatus").style.color = "#1c8a4b";

    setTimeout(function() { window.print(); }, 200);
  }
});
</script>
</body>
</html>
