<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003087">
<title>DHSUD NIR — Admin Panel</title>
<style>
  :root {
    --blue-700:#003087; --blue-600:#0038A8; --blue-500:#2a6fc9;
    --blue-100:#e6eefc; --blue-50:#f5f8fd;
    --green-600:#1c8a4b; --green-500:#22a35a;
    --red-600:#c23b3b; --red-500:#d9534f;
    --ink-900:#0e1825; --ink-700:#2c3a4c; --ink-500:#5a6b80;
    --line:#dbe3ee; --bg:#eef2f8; --white:#fff;
    --shadow-sm:0 1px 2px rgba(15,42,71,.06),0 1px 3px rgba(15,42,71,.04);
    --shadow-md:0 4px 12px rgba(15,42,71,.08),0 1px 3px rgba(15,42,71,.05);
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body {
    margin:0; color:var(--ink-900); min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -220px, #dbe8f7 0%, transparent 70%), var(--bg);
  }

  /* ════════ GOVERNMENT MASTHEAD ════════ */
  .gov-header {
    background:#fff; border-bottom:3px solid #0038A8;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 12px rgba(0,26,77,.10);
  }
  .gov-flag-strip {
    height:5px;
    background:linear-gradient(to right,
      #0038A8 0% 33.33%,
      #CE1126 33.33% 66.66%,
      #FCD116 66.66% 100%);
  }
  .gov-masthead {
    max-width:1200px; margin:0 auto; padding:12px 26px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .gov-seal { width:62px; height:62px; flex-shrink:0;
    filter:drop-shadow(0 1px 2px rgba(0,26,77,.18)); }
  .gov-seal img { display:block; width:100%; height:100%; object-fit:contain; }
  .gov-masthead-text { flex:1; min-width:260px; line-height:1.2; }
  .gov-republic {
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#5a6b80; font-weight:600; margin-bottom:3px;
  }
  .gov-dept-name {
    margin:0; font-size:17px; font-weight:800; color:#001a4d;
    font-family:Georgia,"Times New Roman",serif;
    line-height:1.15; letter-spacing:-.2px;
  }
  .gov-region {
    margin-top:3px; font-size:12px; font-weight:700; color:#0038A8;
    letter-spacing:.12em; text-transform:uppercase;
    font-family:Georgia,"Times New Roman",serif;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .gov-module {
    display:inline-block; padding:2px 8px;
    background:#0038A8; color:#FCD116; border-radius:3px;
    font-size:9.5px; font-weight:800; letter-spacing:.1em;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    text-transform:uppercase;
  }
  .gov-nav { display:flex; gap:6px; flex-wrap:wrap; }
  .gov-nav a {
    color:#0038A8; background:#f4f8fd;
    border:1px solid #c9d8ec; border-radius:6px;
    padding:8px 13px; font-size:12.5px; font-weight:700;
    text-decoration:none; white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .gov-nav a:hover { background:#0038A8; color:#fff; border-color:#0038A8; }

  .wrap { max-width:1140px; margin:26px auto 40px; padding:0 18px; }
  .card {
    background:var(--white); border-radius:var(--radius); padding:26px;
    box-shadow:var(--shadow-md); border:1px solid rgba(219,227,238,.7);
    margin-bottom:22px; animation:fadeUp .35s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .card-header h2 { margin:0; font-size:17px; color:var(--blue-700); letter-spacing:-.2px; }

  .btn-refresh {
    background:var(--blue-50); border:1px solid #d5e3f3; color:var(--blue-700);
    font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px; transition:background .15s ease;
  }
  .btn-refresh:hover { background:var(--blue-100); }
  .btn-refresh.loading { opacity:.55; pointer-events:none; }
  .btn-refresh.loading span { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { 100% { transform:rotate(360deg); } }

  .filter-row { display:flex; gap:16px; align-items:flex-end; margin-bottom:20px; flex-wrap:wrap; }
  .filter-row > div { flex:1; min-width:180px; }
  label { display:block; font-size:12px; font-weight:800; margin-bottom:6px; color:var(--ink-700); letter-spacing:.03em; text-transform:uppercase; }
  input[type="date"] {
    width:100%; padding:12px 14px; border:1.5px solid #ccd9e8; border-radius:var(--radius-sm);
    font-size:15px; font-weight:600; color:var(--ink-900); background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="date"]:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(42,111,201,.18); }

  .btn-load {
    background:linear-gradient(135deg, var(--blue-600) 0%, var(--blue-500) 100%);
    color:#fff; border:0; border-radius:var(--radius-sm); padding:12px 22px;
    font-size:14px; font-weight:700; cursor:pointer; height:46px; white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,56,168,.25);
    transition:filter .15s ease, transform .08s ease;
  }
  .btn-load:hover { filter:brightness(1.06); }
  .btn-load:active { transform:translateY(1px); }

  .table-wrap { overflow-x:auto; border-radius:var(--radius-sm); border:1px solid var(--line); }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; min-width:760px; }
  thead th {
    background:linear-gradient(180deg,#f7fafd,#eef4fb);
    color:var(--ink-500); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    padding:13px 10px; text-align:center; border-bottom:1.5px solid var(--line);
    position:sticky; top:0;
  }
  tbody td { padding:9px 8px; text-align:center; border-bottom:1px solid #eef2f7; }
  tbody td:first-child { text-align:left; font-weight:600; color:var(--ink-900); padding-left:16px; }
  tbody tr:nth-child(even) td { background:#fafcff; }
  tbody tr:hover td { background:var(--blue-50); }
  tbody tr:last-child td { border-bottom:0; }

  input[type="text"] {
    width:100%; padding:8px 10px; border:1.5px solid #dbe3ee; border-radius:8px;
    font-size:13px; font-weight:600; text-align:center; color:var(--ink-900); background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:hover { border-color:#b8cbe3; }
  input[type="text"]:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 3px rgba(42,111,201,.15); background:#fbfdff; }
  input[type="text"]::placeholder { color:#a6b3c4; font-weight:500; }

  button { cursor:pointer; border:0; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; transition:filter .15s ease, transform .08s ease; }
  button:active { transform:translateY(1px); }
  .btn-save { background:linear-gradient(180deg,#25a35c 0%, var(--green-600) 100%); color:#fff; box-shadow:0 2px 6px rgba(28,138,75,.25); }
  .btn-save:hover { filter:brightness(1.07); }
  .btn-del  { background:linear-gradient(180deg,#e05e5e 0%, var(--red-600) 100%); color:#fff; box-shadow:0 2px 6px rgba(194,59,59,.22); }
  .btn-del:hover { filter:brightness(1.07); }
  td:last-child { white-space:nowrap; }
  td:last-child button + button { margin-left:6px; }

  .empty-state { text-align:center; color:var(--ink-500); padding:44px 20px; font-style:italic; font-size:14px; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translate(-50%, 20px);
    background:#0f2a47; color:#fff; padding:14px 24px; border-radius:999px;
    font-size:14px; font-weight:700; box-shadow:0 10px 30px rgba(15,42,71,.35);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:100; max-width:calc(100vw - 48px);
  }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.success { background:linear-gradient(135deg,#1c8a4b,#22a35a); }
  .toast.error   { background:linear-gradient(135deg,#b02a2a,#d9534f); }

  .hidden-iframe { display:none; }

  @media (max-width:860px) {
    .gov-masthead { padding:10px 16px; gap:12px; }
    .gov-seal { width:50px; height:50px; }
    .gov-dept-name { font-size:14.5px; }
    .gov-region { font-size:10.5px; }
    .gov-nav { width:100%; }
    .gov-nav a { font-size:11.5px; padding:7px 11px; }
  }
  @media (max-width:640px) {
    .card { padding:18px; }
  }
</style>
</head>
<body>

<form id="adminForm" method="POST" target="hidden_admin_post" class="hidden-iframe">
  <input type="hidden" name="action" id="af_action">
  <input type="hidden" name="date" id="af_date">
  <input type="hidden" name="code" id="af_code">
  <input type="hidden" name="name" id="af_name">
  <input type="hidden" name="am_in" id="af_am_in">
  <input type="hidden" name="am_out" id="af_am_out">
  <input type="hidden" name="pm_in" id="af_pm_in">
  <input type="hidden" name="pm_out" id="af_pm_out">
</form>
<iframe name="hidden_admin_post" id="hidden_admin_post" class="hidden-iframe"></iframe>

<div id="toast" class="toast"></div>

<header class="gov-header">
  <div class="gov-flag-strip" aria-hidden="true"></div>
  <div class="gov-masthead">
   <div class="gov-seal" aria-hidden="true">
  <img src="dhsud-logo.png" alt="Department of Human Settlements and Urban Development">
</div>
    <div class="gov-masthead-text">
      <div class="gov-republic">Republic of the Philippines</div>
      <div class="gov-dept-name">Department of Human Settlements and Urban Development</div>
      <div class="gov-region">
        Negros Island Region
        <span class="gov-module">Admin Panel</span>
      </div>
    </div>
    <nav class="gov-nav">
      <a href="enroll.html">👤 Enroll Faces</a>
      <a href="kiosk.html">🏠 Kiosk</a>
       <a href="skeletal.html">👥 Skeletal</a>
      <a href="travel.html">✈️ Travel</a>
      <a href="generator.html">🖨️ Print DTR</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-header">
      <h2>Manage Time Logs</h2>
      <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
        <span>🔄</span> Refresh
      </button>
    </div>

    <div class="filter-row">
      <div>
        <label for="filterDate">Date to View / Edit</label>
        <input type="date" id="filterDate">
      </div>
      <div style="flex:0 0 auto; min-width:0;">
        <button class="btn-load" id="btn-load" onclick="loadData()">📥 Load Data</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:26%;">Employee</th>
            <th style="width:15%;">AM In</th>
            <th style="width:15%;">AM Out</th>
            <th style="width:15%;">PM In</th>
            <th style="width:15%;">PM Out</th>
            <th style="width:14%;">Actions</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6" class="empty-state">Select a date and click "Load Data".</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyyaX_v0Nbvxm-QUyRSDEtY3d6CNRHu63fPqTSoz5ly0ixwZR5IX4hWbTD3hb3iHsSR/exec";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Adrian Gallego" }, { code:"22", name:"Jelly Mae B. Benotapa" }, { code:"23", name:"Xenia Santillan" }
];

function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = "toast"; }, 3200);
}

document.addEventListener("DOMContentLoaded", function() {
  var dateInput = document.getElementById("filterDate");
  var tbody = document.getElementById("logTableBody");

  var today = new Date();
  var month = String(today.getMonth() + 1).padStart(2, '0');
  var day   = String(today.getDate()).padStart(2, '0');
  var year  = today.getFullYear();
  dateInput.value = year + "-" + month + "-" + day;

  dateInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") loadData();
  });

  document.getElementById("hidden_admin_post").onload = function() {
    setTimeout(loadData, 1000);
  };

  window.loadData = function() {
    var dateStr = dateInput.value;
    if (!dateStr) { showToast("Please select a date first.", "error"); return; }

    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Loading records...</td></tr>';
    var btn = document.getElementById("btn-refresh");
    btn.classList.add("loading");

    var callbackName = "jsonp_admin_" + Math.round(100000 * Math.random());
    var script = document.createElement("script");
    var done = false;

    function finish(errMsg) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (errMsg) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state" style="color:#a92424; font-style:normal;">Error: ' + errMsg + '</td></tr>';
      }
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[callbackName];
      btn.classList.remove("loading");
    }

    window[callbackName] = function(data) {
      if (data && data.success) {
        renderTable(data.data || {}, dateStr);
        finish(null);
      } else {
        finish((data && data.error) || "Backend returned an error");
      }
    };

    script.onerror = function() {
      finish("Could not load backend. Verify the /exec URL and deployment is public ('Anyone, even anonymous').");
    };
    var timer = setTimeout(function() {
      finish("Backend did not respond within 12s.");
    }, 12000);

    script.src = API_URL + "?action=getLogs&date=" + encodeURIComponent(dateStr) + "&callback=" + callbackName;
    document.body.appendChild(script);
  };

  function renderTable(logs, dateStr) {
    tbody.innerHTML = "";
    var hasRecords = false;

    EMPLOYEES.forEach(function(emp) {
      var rec = logs[emp.code];
      if (rec) {
        hasRecords = true;
        var tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${emp.name}</td>
          <td><input type="text" id="amin-${emp.code}" value="${rec.am_in || ''}" placeholder="8:00 AM"></td>
          <td><input type="text" id="amout-${emp.code}" value="${rec.am_out || ''}" placeholder="12:00 PM"></td>
          <td><input type="text" id="pmin-${emp.code}" value="${rec.pm_in || ''}" placeholder="1:00 PM"></td>
          <td><input type="text" id="pmout-${emp.code}" value="${rec.pm_out || ''}" placeholder="5:00 PM"></td>
          <td>
            <button class="btn-save" onclick="saveRow('${emp.code}', '${emp.name}', '${dateStr}')">Save</button>
            <button class="btn-del" onclick="deleteRow('${emp.code}', '${dateStr}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    });

    if (!hasRecords) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No records found for this date.</td></tr>';
    }
  }

  window.saveRow = function(code, name, dateStr) {
    document.getElementById("af_action").value = "saveLog";
    document.getElementById("af_date").value   = dateStr;
    document.getElementById("af_code").value   = code;
    document.getElementById("af_name").value   = name;
    document.getElementById("af_am_in").value  = document.getElementById("amin-"+code).value.trim();
    document.getElementById("af_am_out").value = document.getElementById("amout-"+code).value.trim();
    document.getElementById("af_pm_in").value  = document.getElementById("pmin-"+code).value.trim();
    document.getElementById("af_pm_out").value = document.getElementById("pmout-"+code).value.trim();

    document.getElementById("adminForm").action = API_URL;
    document.getElementById("adminForm").submit();
    showToast("✅ Sent to Google Sheets — refreshing...", "success");
  };

  window.deleteRow = function(code, dateStr) {
    if (confirm("Are you sure you want to completely delete this record?")) {
      document.getElementById("af_action").value = "deleteLog";
      document.getElementById("af_date").value   = dateStr;
      document.getElementById("af_code").value   = code;
      document.getElementById("adminForm").action = API_URL;
      document.getElementById("adminForm").submit();
      showToast("🗑️ Deleting record...", "error");
    }
  };

  loadData();
});
</script>
</body>
</html>
