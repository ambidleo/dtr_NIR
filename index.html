<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DHSUD NIR — Admin Panel</title>
<style>
  :root { --blue:#1f4e79; --accent:#4a90d9; --danger:#d9534f; --success:#5cb85c; }
  * { box-sizing:border-box; font-family:system-ui,Segoe UI,Arial,sans-serif; }
  body { margin:0; background:#eef2f7; color:#1a1a1a; }
  header { background:var(--blue); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:18px; }
  .nav-links a { color:#fff; text-decoration:none; font-size:13px; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:4px; margin-left:8px; }
  .nav-links a:hover { background:rgba(255,255,255,0.3); }
  .wrap { max-width:1100px; margin:22px auto; padding:0 16px; }
  .card { background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:22px; }
  
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom:14px; }
  .card-header h2 { margin:0; font-size:17px; color:var(--blue); }
  
  .btn-refresh { background:none; border:none; color:var(--blue); font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:4px; }
  .btn-refresh:hover { background:#f0f8ff; }
  .btn-refresh.loading { opacity: 0.5; pointer-events: none; }
  .btn-refresh.loading span { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .filter-row { display:flex; gap:15px; align-items:flex-end; margin-bottom:20px; }
  .filter-row > div { flex:1; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  input[type="date"] { width:100%; padding:10px; border:1px solid #ccd5e0; border-radius:6px; font-size:15px; }
  
  .btn-load { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 20px; font-size:15px; font-weight:600; cursor:pointer; height:42px; }
  .btn-load:hover { filter:brightness(.95); }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { border:1px solid #d9e1ea; padding:8px; text-align:center; }
  th { background:#f3f6fa; font-weight:600; color:var(--blue); }
  td { vertical-align: middle; }
  input[type="text"] { width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:13px; text-align:center; }
  input[type="text"]:focus { border-color:var(--accent); outline:none; background:#f0f8ff; }
  button { cursor:pointer; border:0; border-radius:4px; padding:8px 12px; font-size:13px; font-weight:600; }
  .btn-save { background:var(--success); color:#fff; }
  .btn-del { background:var(--danger); color:#fff; }
  .btn-save:hover, .btn-del:hover { filter:brightness(0.9); }
  .empty-state { text-align:center; color:#6b7a8d; padding:30px; font-style:italic; }
  .hidden-iframe { display:none; }
</style>
</head>
<body>

<form id="adminForm" method="POST" target="hidden_admin_post" class="hidden-iframe">
  <input type="hidden" name="action" id="af_action">
  <input type="hidden" name="date" id="af_date">
  <input type="hidden" name="code" id="af_code">
  <input type="hidden" name="name" id="af_name">
  <input type="hidden" name="am_in" id="af_am_in">
  <input type="hidden" name="am_out" id="af_am_out">
  <input type="hidden" name="pm_in" id="af_pm_in">
  <input type="hidden" name="pm_out" id="af_pm_out">
</form>
<iframe name="hidden_admin_post" id="hidden_admin_post" class="hidden-iframe"></iframe>

<header>
  <h1>DHSUD NIR — Admin Panel</h1>
  <div class="nav-links">
    <a href="kiosk.html">Kiosk</a>
    <a href="generator.html">Print DTR</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-header">
      <h2>Manage Time Logs</h2>
      <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
        <span>🔄</span> Refresh
      </button>
    </div>
    
    <div class="filter-row">
      <div>
        <label for="filterDate">Select Date to View / Edit</label>
        <input type="date" id="filterDate">
      </div>
      <div style="flex: 0 0 auto;">
        <label>&nbsp;</label>
        <button class="btn-load" id="btn-load" onclick="loadData()">📥 Load Data</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:25%;">Employee</th>
          <th style="width:15%;">AM In</th>
          <th style="width:15%;">AM Out</th>
          <th style="width:15%;">PM In</th>
          <th style="width:15%;">PM Out</th>
          <th style="width:15%;">Actions</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr><td colspan="6" class="empty-state">Select a date and click "Load Data".</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ⚠️ REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
var API_URL = "https://script.google.com/macros/s/AKfycbxbm3rgbes2I5u9xR_FBMpD_ZXn5mQGTMD5C2vWDyPB_XY_sdu3TO-RXQxyFS93gwA/exec";

var EMPLOYEES = [
  { code:"01", name:"Elenita Paulina R. Cañete" }, { code:"02", name:"Brechelle Grace P. Benotapa" },
  { code:"03", name:"Engr. Precious Danica V. Valleramos" }, { code:"04", name:"Engr. Harrison C. Gudito, MPA" },
  { code:"05", name:"Erika Joy S. Guiloreza" }, { code:"06", name:"Stanley S. Adraneda" },
  { code:"07", name:"Katrina S. Amonares" }, { code:"08", name:"Lorie Ann A. Bantayan" },
  { code:"09", name:"Daisy Mae T. Batuigas" }, { code:"10", name:"Marla Beth C. Deocadez" },
  { code:"11", name:"Kimberly M. Enim" }, { code:"12", name:"Arnie Rose N. Famoso" },
  { code:"13", name:"Debbie H. Felomira" }, { code:"14", name:"Philjoe M. Maghanoy" },
  { code:"15", name:"Paul Ryan B. Pacardo" }, { code:"16", name:"Shaira June Rubia" },
  { code:"17", name:"Paul D. Sartorio" }, { code:"18", name:"Christalyn Tan" },
  { code:"19", name:"Helen Mae B. Tandog" }, { code:"20", name:"Leo Ambid" }, { code:"21", name:"Earl Gallego" }
];

document.addEventListener("DOMContentLoaded", function() {
  var dateInput = document.getElementById("filterDate");
  var tbody = document.getElementById("logTableBody");
  
  // Set today's date by default
  var today = new Date();
  var month = String(today.getMonth() + 1).padStart(2, '0');
  var day = String(today.getDate()).padStart(2, '0');
  var year = today.getFullYear();
  dateInput.value = year + "-" + month + "-" + day;

  // Allow pressing Enter in date field to load
  dateInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") loadData();
  });

  document.getElementById("hidden_admin_post").onload = function() {
    setTimeout(loadData, 800);
  };

  window.loadData = function() {
    var dateStr = dateInput.value;
    if (!dateStr) {
      alert("Please select a date first.");
      return;
    }
    
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Loading records...</td></tr>';
    
    var btn = document.getElementById("btn-refresh");
    btn.classList.add("loading");

    var callbackName = "jsonp_admin_" + Math.round(100000 * Math.random());
    
    window[callbackName] = function(data) {
      if(data.success) {
        renderTable(data.data, dateStr);
      } else {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Error loading data.</td></tr>';
      }
      if (script.parentNode) script.parentNode.removeChild(script);
      delete window[callbackName];
      btn.classList.remove("loading");
    };

    var script = document.createElement("script");
    script.src = API_URL + "?action=getLogs&date=" + dateStr + "&callback=" + callbackName;
    document.body.appendChild(script);
  }

  function renderTable(logs, dateStr) {
    tbody.innerHTML = "";
    var hasRecords = false;

    EMPLOYEES.forEach(function(emp) {
      var rec = logs[emp.code];
      
      if (rec) {
        hasRecords = true;
        var tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align:left; font-weight:bold;">${emp.name}</td>
          <td><input type="text" id="amin-${emp.code}" value="${rec.am_in || ''}" placeholder="e.g. 8:00 AM"></td>
          <td><input type="text" id="amout-${emp.code}" value="${rec.am_out || ''}" placeholder="e.g. 12:00 PM"></td>
          <td><input type="text" id="pmin-${emp.code}" value="${rec.pm_in || ''}" placeholder="e.g. 1:00 PM"></td>
          <td><input type="text" id="pmout-${emp.code}" value="${rec.pm_out || ''}" placeholder="e.g. 5:00 PM"></td>
          <td>
            <button class="btn-save" onclick="saveRow('${emp.code}', '${emp.name}', '${dateStr}')">Save</button>
            <button class="btn-del" onclick="deleteRow('${emp.code}', '${dateStr}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    });

    if (!hasRecords) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No records found for this date.</td></tr>';
    }
  }

  window.saveRow = function(code, name, dateStr) {
    document.getElementById("af_action").value = "saveLog";
    document.getElementById("af_date").value = dateStr;
    document.getElementById("af_code").value = code;
    document.getElementById("af_name").value = name;
    document.getElementById("af_am_in").value = document.getElementById("amin-"+code).value.trim();
    document.getElementById("af_am_out").value = document.getElementById("amout-"+code).value.trim();
    document.getElementById("af_pm_in").value = document.getElementById("pmin-"+code).value.trim();
    document.getElementById("af_pm_out").value = document.getElementById("pmout-"+code).value.trim();

    document.getElementById("adminForm").action = API_URL;
    document.getElementById("adminForm").submit();
    alert("✅ Sent to Google Sheets! (Refreshing...)");
  };

  window.deleteRow = function(code, dateStr) {
    if (confirm("Are you sure you want to completely delete this record?")) {
      document.getElementById("af_action").value = "deleteLog";
      document.getElementById("af_date").value = dateStr;
      document.getElementById("af_code").value = code;

      document.getElementById("adminForm").action = API_URL;
      document.getElementById("adminForm").submit();
    }
  };

  // Load data immediately on page load
  loadData();
});
</script>
</body>
</html>
